形式的信号并按一定规律转换为另一种信号形式输\n出的装置。\n\n2.0.4 变送器transmiter\n从敏感元件、传感器或直接从工艺系统接受物理、化学变量，\n并将其转换成标准化信号输出的一种测量装置。\n2.0.5 控制仪表control instrument\n用以对被控变量进行控制的仪表。\n\n2.0.6 执行器actuator\n在控制系统中通过其机构动作直接改变被控变量的装置。\n\n2.0.7 取源部件tap\n在被测对象上为安装连接敏感元件所设置的专用管件、引出\n口和连接阀门等元件。\n\n2.0.8 敏感元件(sensing element)\n敏感元件即检出元件，是直接响应被检变量，并将它转换成\n适用测量形式的元件或器件，亦称检出器。\n2.0.9 控制系统control system\n通过精密制导或操纵若干变量以达到既定状态的系统。仪表\n控制系统由仪表设备装置、仪表管线、仪表动力和辅助设施等硬"},{"s":0,"p":16,"t":"2 术语","x":"件，以及相关的软件所构成。\n2.0.10 回路lop\n在控制系统中，一个或多个相关仪表与功能的组合。\n\n2.0.1 爆炸危险区域explosive dangerous zone\n爆炸性混合物出现的或预期可能出现的数量达到足以要求对\n电气设备的机构、安装和使用采取预防措施的区域。\n\n2.0.12 现场总线field bus\n一个数字化、串行、双向传输、多分支结构的通信网络系统，\n是用于工厂/车间仪表和控制设备的局域网。"},{"s":0,"p":17,"t":"3 基本规定","x":"3基本规定\n\n3.1 一般规定\n\n3.1.1 热工仪表及控制装置的施工应以设计单位和制造单位的技术文件为依据，如需设计更改，应办理审批手续，并提供完整的\n设计更改资料。\n\n3.1.2 凡在压力容器、管道上施焊及进行热处理的人员应取得相\n应的专业资格证书。\n\n3.1.3 施工单位的热工试验室应取得相应的资质。\n\n3.1.4 仪表校验人员应取得相应的专业资格证书并满足国家和行\n业有关规定。\n\n3.1.5 热工仪表及控制装置的安装应保证测量与控制系统能准确、灵敏、安全、可靠工作，避免受振动、高温、低温、灰尘、\n潮湿、腐蚀等的影响。\n\n3.1.6 热工仪表及控制装置应安装整齐，安装地点应采光良好，\n便于操作、维护，不影响运行检修通道。\n\n3.1.7 控制室和电子设备室内的温度、湿度及粉尘浓度应满足设计、设备技术文件要求，电子设备室应有防止小动物进入的措施。\n\n3.1.8 热工仪表及控制装置的标识应正确、清晰。\n3.1.9 热工仪表及控制装置绿色建造应符合下列要求：\n1优先选用国家、行业推荐的节能环保的施工机具。2合理安排工序，降低机械、设备的单位能耗。3优化电缆、仪表管路的路径，减少材料消耗。4施工过程产生的废弃物分类处置。\n5优先采用工厂化加工安装附件，减少现场制作。"},{"s":0,"p":18,"t":"3 基本规定","x":"3.1.10 火灾自动报警系统的施工应符合《火灾自动报警系统施工\n及验收规范》GB 5016的规定。\n\n3.2 开箱检验与保管\n\n3.2.1 设备到达现场后，应按合同约定和商检要求进行开箱检验。\n设备开箱应符合下列规定：\n1设备开箱应由建设单位或总承包单位组织，监理单位、供\n货单位、施工单位及设备保管单位参加。\n2应按装箱单核对设备及其附件、备品、备件、专用仪器、\n专用工具的型号、规格、数量和技术资料并应会签确认。\n3设备外观检查如发现破损、变形和锈蚀等情况，应按合同\n约定进行处理。\n4精密、贵重设备开箱检查后，应恢复其必要的包装，并应\n妥善保管。\n\n3.2.2 已开箱检验的设备、材料应按《电力基本建设火电设备维护保管规程》DL/T85和制造单位技术文件规定的保管条件分类\n入库保管，并应采取以下措施：\n1测量仪表、控制装置、监视和控制系统硬件、电子装置机\n柜等精密设备，宜存放在温度为5℃～40℃、相对湿度不大于80%\n的保温库内。\n2分析仪表及探头应严格按照制造单位的技术文件要求存放。3控制盘(台、箱、柜)、执行机构、电线、阀门、有色金\n属、合金钢材、管件及一般电气设备，应存放在干燥的封闭库内。\n4管材应分类存放在棚库内并应有明确标识。5不锈钢材质的设备材料保管应采取防渗碳隔离措施。6电缆盘应包装完整直立存放，存放场所的地基应坚实并易\n于排水，在露天堆放场内应避免直接曝晒。\n\n3.2.3 设备由温度低于-5℃的环境移入保温库时，应在库内放置\n24h后再开箱。"},{"s":0,"p":19,"t":"3 基本规定","x":"3.2.4 防腐包装的设备运到现场后，不得随意打开，应按合同约定办理交接手续。包装箱外(或内)有湿度指示器、振动指示器或倾斜指示器时，开箱前(或后)应检查指示器，应在建设单位、\n监理单位见证下做好记录。\n\n3.3 施工准备\n\n3.3.1 热工仪表及控制装置施工前应具备下列条件：\n1施工图纸、技术文件应齐全，图纸已经过会检。2专业施工组织设计、施工技术方案、作业指导书已审批。3热工仪表及控制装置、安装材料、施工机具基本齐全，检\n定设备经检定合格，并在使用有效期内。\n4安全、技术交底和必要的培训已进行。5现场环境已具备施工条件。6施工人员具备相应的专业资格。7质量验收项目划分表已报审。\n3.3.2 安装前各类管材、阀门、承压部件应进行检查和清理，其\n中合金钢部件应进行光谱分析并应做标识。\n\n3.3.3 高温高压取源阀门安装前，应按下列规定进行检验：\n1检查应在每批次(同牌号、同型号、同规格)阀门数量中\n抽取10且不少于3个。\n2根据技术协议要求核对阀芯、阀座、阀杆的材质。3检验中发现问题时，应增加阀门抽取比例检验。4取源阀门应进行严密性试验，试验标准符合本规范附录A\n的规定。\n\n3.3.4 应对设备基础及预留孔和预埋铁件的坐标、尺寸进行核查。不得在建筑结构上随意开孔和施焊，如果施工必须进行，应经设\n计单位确认。\n\n3.3.5 仪表管道及测量元件安装前，应对相关专业的预留孔和已\n装的取源部件进行核查。6\n0L5190.4-201"},{"s":0,"p":20,"t":"3 基本规定","x":"3.3.6 不得在承压容器和管道上焊接非承压部件。\n\n3.3.7 热工仪表及控制装置的安装，宜在有可能对其造成损坏的施工序完成后进行；否则，应采取适当的防护和隔离措施。\n7"},{"s":0,"p":21,"t":"4 取源部件及敏感元件安装","x":"4取源部件及敏感元件的安装\n\n4.1 一般规定\n\n4.1.1 取源部件及敏感元件应设置在能够真实反映被测介质参数，便于维护检修且不易受机械损伤的工艺设备或管道上。\n4.1.2 取源部件及敏感元件不应设置在人孔、看火孔、防爆门及\n排污门附近。\n\n4.1.3 不得在蒸汽管道的监察段上开孔和安装取源部件。\n4.1.4 在热力设备和压力管道上开孔，应采用机械加工的方法；烟风系统取样开孔可采用气体火焰切割，但孔口应打磨光洁。\n4.1.5 取源部件的开孔、施焊及热处理工作，应在管道衬里或热力设备清洗和严密性试验前进行。不得在已封闭和保温的热力设备或管道上开孔、施焊，必须进行时，应采取相应的措施并应办\n理审批手续。\n\n4.1.6 取源部件不得设置在焊缝或热影响区内。\n\n4.1.7 取源部件的材质应与热力设备或管道的材质相符，并应有\n质量合格证件。\n\n4.1.8 合金钢部件、取源管安装前、后，必须经光谱分析复查合\n格，并应做记录。安装后进行焊口无损检验。\n\n4.1.9 合金钢部件、取源管的焊接及热处理，应符合《火力发电\n厂焊接技术规程》DL/T 869的规定。\n\n4.1.10 取源部件的垫片材质应按本规范附录B的规定选用。\n4.1.1 相邻两测点之间的距离应大于被测管道外径，且不得小于20m;当压力取源部件和测温元件在同一管段上邻近装设时，\n按介质流向压力在前，温度在后。8"},{"s":0,"p":22,"t":"4 取源部件及敏感元件安装","x":"4.1.12 高压及中压的压力、流量、成分析取源部件，应加装焊接取源短管，取源短管的安装应符合本规范第\n4.3 节和第\n4.4 节的\n规定，取源短管的外露长度应超过保温层。\n\n4.1.13 在高压及中压管道的同一断面管壁上只允许开一个孔。\n4.1.14 取源阀门应靠近测点，便于操作，固定牢固，不应影响主设备热态位移。取源阀门的型号、规格应符合设计要求。\n4.1.15 当介质参数大于10℃时，取源阀门应采用焊接的方式连接；介质参数小于或等于10℃时，可选用外螺纹连接。取源阀\n门前不得采用卡套式接头。\n\n4.1.16 取源阀门应在热力系统压力试验前安装，并参加主设备的\n严密性试验。\n\n4.1.17 取源部件或敏感元件安装后，应有设计编号、名称及用途\n的标识。\n\n4.1.18 在易燃、易爆等危险环境安装取源部件，应按已批准的设\n计文件及规范进行施工。\n\n4.1.19 用于保护、调节的重要单点测点信号，取样及测量管路必\n须独立，禁止和其他测点混合使用。\n\n4.1.20 在砌筑和混凝土浇筑体上安装的取源部件，应在砌筑或浇筑的同时埋入，埋入深度、露出长度应符合设计和工艺要求。当无法同时安装时，应预留安装孔。安装孔周围应按设计文件规定\n的材料填充密实，封堵严密。\n\n4.2 温  度\n\n4.2.1 测温元件应装在测量值能代表被测介质温度处，不得装在\n管道和设备的死角处。\n\n4.2.2 测量容积较大的设备和管道温度时，应采用多点测量方式。\n4.2.3 测温元件应装在不受剧烈振动及共振影响的区域和冲击处。在中、低压大流速管道上安装温度元件插座时，应加装保护\n管或在其上游采取保护措施。"},{"s":0,"p":23,"t":"4 取源部件及敏感元件安装","x":"4.2.4 热电偶或热电阻装在隐蔽处或机组运行中人员无法接近的位置时，其接线端应引到便于检修处。热电偶、热电阻的延长段\n应不受额外应力并避开振动区域。\n\n4.2.5 热电偶或热电阻保护套管及插座的材质，应符合被测介质\n及其参数的要求。\n\n4.2.6 测温元件的插座及保护套管应在热力系统压力试验前安\n装，并应参加主设备的严密性试验。\n4.2.7 测温元件的安装应符合下列规定：\n1高温高压管道上的测温元件宜采用焊接安装。2对于高、中压设备及管道，若插座全部在保温层内，插座\n延长管高度不得低于保温层厚度。\n3采用螺纹固定的测温元件安装前，应测量插座螺纹和元件\n螺纹的公差尺寸或进行试装。\n4测温元件与插座之间应装密封垫片，垫片材质应确保投入\n运行后无泄漏。\n5清除温度插座内部的氧化层，并在螺纹上涂抹防锈或防卡\n涩材料。\n\n4.2.8 水平安装的测温元件，若插入深度大于1m,应有防止保护\n套管弯曲折断的加固防护措施。\n\n4.2.9 风粉管道上安装的测温元件，应装有可与测温元件一同拆\n卸的防磨损保护罩或采取其他防磨损措施。\n\n4.2.10 在直径为76m以下的管道上安装测温元件时，如无小型\n测温元件，宜采用加装相同材质扩大管的方法安装。\n4.2.1 在公称压力不大于1.6MPa的管道上安装测温元件时，可\n采用在弯头处沿管道中心线迎着介质流向插入安装。\n4.2.12 双金属温度计应装在便于监视、不易遭受机械损伤的部\n位，且应加装保护套管。\n\n4.2.13 压力式温度计的温包应全部浸入被测介质中。毛细管的敷设应有保护措施，其弯曲半径不应小于50m,在通过温度较高"},{"s":0,"p":24,"t":"4 取源部件及敏感元件安装","x":"或有剧烈变化的区域时，应采取隔热措施。\n\n4.2.14 插入式热电偶和热电阻的套管，其插入深度应符合下列要\n求：\n1高温高压蒸汽管道的公称通径不大于250m时，插入深\n度宜为70m;公称通径大于250m时，插入深度宜为10m。\n2一般流体介质管道的外径不大于50m时，插入深度宜\n为管道外径的1/2;外径大于50m时，插入深度宜为30m。\n3烟、风及风粉混合物介质管道，插入深度宜为管道外径的\n1/3～1/2。\n4回油管道上测温元件的测量端，应浸入被测介质中。\n\n4.2.15 测量粉仓煤粉温度的测温元件，宜从粉仓顶部垂直插入并采取防磨损及防弯曲的加固措施，其插入深度宜分上、中、下三\n种，可测量不同断面的煤粉温度。\n\n4.2.16 安装在高温、高压汽水管道上的测温元件，应与管道中心\n线垂直。\n\n4.2.17 汽轮机内缸的测温元件应安装牢固，紧固件应锁紧，测温\n元件宜便于拆卸，引出处不得渗漏。\n\n4.2.18 测量金属温度的测温元件，其测量端应紧贴被测表面且接\n触良好，被测表面有保温设施的应一起加以保温。\n\n4.2.19 测量锅炉过热器、再热器管壁温度的热电偶测量端，宜装在离顶棚管上面10m内的垂直管段上。当锅炉结构不允许时可适当上移，但装于同一过热器或再热器上的各测点的标高应一致，\n焊接工作应在水压试验前进行。\n\n4.2.20 测量汽轮机前导汽管壁温的热电偶，其测量端应安装在水\n平管段的下部。\n\n4.2.21 汽轮机防进水保护的测温元件安装部位和插入深度应符\n合设计单位或制造单位的要求。\n\n4.2.2 已安装的测量管壁温度铠装热电偶，应有防止因现场后续\n施工而被损坏的措施。"},{"s":0,"p":25,"t":"4 取源部件及敏感元件安装","x":"4.2.23 测量汽轮机轴瓦温度的备用测温元件，应将其引线引至接线盒。温度元件引出轴承箱壁接头处应做好防渗漏措施。\n4.2.24 燃油、燃气等易燃、易爆介质管道和设备的测温元件应采\n用焊接方式连接。\n\n4.3 压  力\n\n4.3.1 压力测点位置的选择应符合下列规定：\n1测量管道压力的测点，应设置在流速稳定的直管段上，不\n应设置在有三通、弯头、变径、管道的末端等易产生涡流的部位。\n2压力取源部件与管道上调节阀的距离：取源部件位于调节\n阀上游时应大于2倍工艺管道内径；取源部件位于调节阀下游时\n应大于5倍工艺管道内径。\n3测量低于0.1MPa的压力时，应减少液柱引起的附加偏差。4测量较大容器微压、负压时，应采用多点取样的方式，不\n得使用均压管。\n5炉膛压力取源部件的位置应符合锅炉厂要求，宜设置在燃\n烧室火焰中心的上部。\n6锅炉一次风管的压力测点，应选择在燃烧器之前，能正确\n反映一次风压力的位置；二次风管的压力测点，应选择在空气预\n热器后至燃烧器之间，宜保持距离相等。\n7中储仓式制粉系统磨煤机入口的风压取源部件，应装设在\n磨煤机入口颈部；磨煤机出口的风压取源部件，应装设在靠近粗\n粉分离器的气粉混合物管道上。\n8汽轮发电机润滑油压测点，应选择在油管路末段压力较\n低处。\n9凝汽器真空压力测点取源部件的位置应设置在凝汽器喉\n部的中心点上，并符合产品技术要求。\n\n4.3.2 水平或倾斜管道上压力测点的安装方位，应符合下列规定：\n1测量气体压力时，测点应安装在管道的上半部，见图4.3.2a)。"},{"s":0,"p":26,"t":"4 取源部件及敏感元件安装","x":"2测量液体压力时，测点应安装在与管道水平中心线以下呈\n0°～45°夹角的范围内，见图4.3.2b)。\n3测量蒸汽压力时，测点应安装在管道的上半部或与管道水\n平中心线以下呈0°～45°夹角的范围内，见图4.3.2c)。\n180°\n45°\n/45°\n45°\n/45°\na)测量气体压力\nb)测量液体压力\ne)测量燕汽压力\n图\n4.3.2 压力测点的安装方位\n\n4.3.3 测量带有灰尘或气粉混合物等介质的压力时，应采取具有防堵和吹扫结构的取压装置。取压管的安装方向应符合下列规定：\n1在垂直管道、炉墙或烟道上，取压管应倾斜向上安装，与\n水平线所成的夹角应大于30°。\n2在水平管道上，取压管应安装在管道上方，且宜垂直安装。\n\n4.3.4 风压的取压孔径应与取压装置外径相符。取压装置应有吹\n扫用的管接头和可拆卸的堵头。\n\n4.3.5 压力取源部件的端部不得超出被测设备或管道的内壁。\n\n4.4 流  量\n\n4.4.1 流量测量节流装置的安装应符合《用安装在圆形截面管道中\n的差压装置测量满管流体流量》GB/T 2624的规定。\n4.4.2 安装前应对节流件的外观、安装方向及节流孔直径进行检查和测量，并做好记录。节流件外观、材质、尺寸应符合设计和《用安装在圆形截面管道中的差压装置测量满管流体流量》GB/T"},{"s":0,"p":27,"t":"4 取源部件及敏感元件安装","x":"2624的规定。\n\n4.4.3 节流件上、下游直管段的最小长度，应符合本规范附录C\n的规定。\n\n4.4.4 在节流件上游至少2倍管道内径长度范围内，其管道任何\n断面上的内径偏差平均值应在±0.3?内。\n\n4.4.5 在节流件上游至少10倍管道内径和下游至少4倍管道内径长度范围内，管子的内表面应清洁，并符合粗糙度等级参数的规定。\n4.4.6 节流装置的每个取压装置，至少应有一个上游取压口和一个下游取压口，且具有相同的直径。不同取压方式的上下游取压口位置、直径应符合《用安装在圆形截面管道中的差压装置测量\n满管流体流量》GB/T 2624的规定。\n\n4.4.7 节流装置取压口的轴线应与管道轴线相交，并应与其呈直\n角。取压口的内边缘应与管道内壁平齐。\n\n4.4.8 节流装置的差压用均压环取压时，上、下游侧取压孔的数量应相等，同一侧的取压孔应在同一截面上均匀设置。\n4.4.9 节流件在管道中安装应垂直于管道轴线。\n\n4.4.10 当采用夹持环时，夹持环的任何部位不得凸入管道内，如节流件与夹持环之间使用垫圈时，垫圈不应凸入夹持环内。\n4.4.1 节流件采用角接取压装置时，垫圈不得挡住取压口或槽。\n4.4.12 在水平或倾斜管道上安装的节流装置，当流体为气体或液体时，取压口的方位应符合本规范第\n4.3.2 条中第1款和第2款的\n规定。\n\n4.4.13 在水平或倾斜蒸汽管道上安装的节流装置，其取压口的方位应在管道的上半部与水平中心线呈45°夹角的范围内。\n4.4.14 测量蒸汽流量的节流件上、下游取压口装设冷凝器应符合设计要求，安装时两个冷凝器的液面应处于相同的高度，且不低于取压口。差压仪表高于节流装置时，冷凝器应高于差压仪表，\n冷凝器至节流装置的管路应保温。\n\n4.4.15 新装管路系统应在管道冲洗合格后再进行节流件的安装。\n14\n015190,4-201\n2624的规定"},{"s":0,"p":28,"t":"4 取源部件及敏感元件安装","x":"4.4.16 均速管流量计取源部件的轴线，应与管道轴线垂直相交。均速管插入管道时，动压孔应迎着介质流动方向，静压孔中心线应与管道中轴线重合，均速管前、后的直管段长度应符合制造单\n位技术文件的要求。\n\n4.4.17 复式文丘里风量测量装置的前、后直管段长度应符合制造\n单位技术文件的要求。\n\n4.4.18 翼形风量测量装置前的直管段长度，不应小于管道当量直径的\n0.6 倍，其后的直管段长度不应小于\n0.2 倍。测量装置的中心线应与风道中心线重合，风道同一测点处安装两个及以上翼形测\n速管，其静压孔应在同一截面上。\n\n4.4.19 靶式流量计宜安装于水平管道上，当必须安装于垂直管道时，流体方向应由下向上。靶的中心应在工艺管段的轴线上。\n4.4.20 转子流量计应垂直安装，对\n1.0 级和\n1.5 级的流量计倾斜度不应超过2°,对低于\n1.5 级的流量计倾斜度不应超过5°,流体应自下而上通过流量计。上游直管段的长度不宜小于5倍工艺\n管道内径。\n\n4.4.21 速度式流量计，如涡轮流量计、涡街流量计、电磁流量计、\n超声波流量计等传感器安装应符合下列规定：\n1流量计上、下游直管段长度按制造单位规定，其内径与流\n量计的公称通径之差不应超过公称通径的±3并不得超过±5m;对准确度不低于\n0.5 级的流量计，流量计上游10倍公称通径长度内和下游2倍公称通径长度内的直管段内壁应清洁，无\n明显凹痕、积垢和起皮现象。\n2当上游直管段长度不够时，可安装整流器。\n3安装时应使流量计的中心线与管道中心线保持一致，最大\n偏离角度不应大于3°。\n4电磁流量计应保证流体、法兰、表壳处于同电位，接地应\n符合产品技术文件的要求。\n\n4.4.2 安装于管道中的质量流量计传感器，其流向标识应与介质"},{"s":0,"p":29,"t":"4 取源部件及敏感元件安装","x":"流向一致，安装环境应避免振动，传感器接头两端固定时，应确\n保其不受应力。\n\n4.4.23 大型烟、风道流量测量，应采用同一截面多点取样取平均\n值的方式。\n\n4.5 物  位\n\n4.5.1 物位测点应选择在介质工况稳定处，并应满足仪表测量范\n围的要求。\n\n4.5.2 单室平衡容器的安装应符合下列规定：1平衡容器应垂直安装。\n2平衡容器安装标高及与其配合的正、负取压口的距离应符\n合设计要求的测量范围。\n\n4.5.3 双室平衡容器的安装应符合下列规定：\n1安装前应复核制造尺寸和检查内部管路的严密性。2平衡容器应垂直安装，其正、负取压管间的距离应符合设\n计要求的测量范围。\n\n4.5.4 汽包水位测量所用补偿式平衡容器或热套双室平衡容器及\n其管路的安装，应符合下列规定：\n1安装前应复核制造尺寸和检查内部管路的严密性。2取源阀门应安装在汽包与平衡容器之间。\n3平衡容器应垂直安装，并应使其零水位标识与汽包零水位\n线处在同一水平上。\n4平衡容器的疏水管应单独引至下降管，垂直距离为10m\n左右，宜单独保温，在靠近下降管侧应装截止阀。\n5双室平衡容器除上部汽侧外均应保温。\n4.5.5 安装平衡容器、阀门和管路时，应有防止因热力设备热膨\n胀产生位移而被损坏的措施。\n\n4.5.6 高、低压加热器水位平衡容器及其管路不得保温，并应采\n取防护措施。16\n593-"},{"s":0,"p":30,"t":"4 取源部件及敏感元件安装","x":"4.5.7 位于汽包等被测容器与平衡容器之间的取源阀门应横向安装且阀杆水平，平衡容器至被测容器的汽侧导管应有使凝结水回\n流的坡度。\n\n4.5.8 在蒸汽不易凝结成水的平衡容器上应装设补水管路，其他\n低压平衡容器可装灌水丝堵。\n\n4.5.9 平衡容器至差压仪表的正、负压管，应水平引出40m后\n再向下并列敷设。\n\n4.5.10 电接点水位计的测量筒应垂直安装，垂直偏差不得大于2°,其底部应装设排污阀门。筒体零水位电极的中轴线与被测容\n器的零水位线应处于同一高度。\n\n4.5.1 从电接点水位计引出至下降管的疏水管的安装应符合本\n规范第\n4.5.4 条中第4款的规定。\n\n4.5.12 双法兰液位变送器的毛细管敷设弯曲半径应大于75m\n且不得扭折，两毛细管应在相同环境温度下。\n\n4.5.13 外浮筒液位计的浮筒安装标高应符合设计要求的测量范\n围，浮筒室壳体上的中线标识对应测量范围中点。\n\n4.5.14 内浮筒液位计及浮球液位计采用导向管时，导向管应垂直安装。导向管和下挡圈均应固定牢靠，并使浮筒位置限制在所检\n测的量程内。\n\n4.5.15 电容式物位计的传感器应垂直安装，垂直度偏差不得超过\n5°,且应避开下料口物料对电极的撞击。\n\n4.5.16 超声波料位计探测器的安装与容器内壁的距离，应大于最大测量距离处的波束半径，且应避开下料口，超声波束传输范围\n内不应有料位界面外的其他物体。\n\n4.5.17 测量煤料物位的重锤式探测料位计传感器和射频导纳式煤料物位传感器应垂直安装，安装位置应选择远离进、出料口的\n位置。\n\n4.5.18 在容易产生水汽蒸发的容器上或集水坑上方不宜安装超\n声波液位计。"},{"s":0,"p":31,"t":"4 取源部件及敏感元件安装","x":"4.6 分  析\n\n4.6.1 分析仪表的取样部件安装，应按设计单位和制造单位产品\n技术文件的要求，装在取样品有代表性的位置。\n\n4.6.2 烟气、脱硫、脱硝系统的分析仪表，应按制造单位产品技\n术文件的要求进行安装。\n\n4.6.3 氧化锆探头安装位置应避开漏风处，并应有使凝结水流回烟道的坡度。测量时气样温度应符合制造单位产品技术文件的要求。\n4.6.4 氢分析器取样系统从氢压较高部位取出的氢气，经分析器\n后进入氢压较低的部位，气路系统应严密。\n\n4.6.5 被测介质进入分析仪表前应采取减温减压措施，保证进入\n仪表的介质状态满足设备技术要求。\n\n4.7 机械量\n\n4.7.1 传感器的安装支架应有足够的刚度，防止变形，并应有防松动的措施。传感器在支架上应固定牢固，传感器中心轴线与测\n量表面的垂直度应满足产品技术说明书要求。\n\n4.7.2 电磁感应式传感器铁芯所对应的汽轮机转子凸轮边缘应平整，各部分间隙及安装调整应符合制造单位技术文件的要求。\n4.7.3 电涡流式传感器与被检测金属间的安装间隙，应根据产品技术文件提供的输出特性曲线所确定的线性中点位置而定。传感器与前置器之间连接的高频电缆型号、长度不得任意改变，高频接头应用热缩套管密封并绝缘浮空。前置器安装地点环境及其他\n要求应符合制造单位产品技术文件要求。\n4.7.4 转速测量传感器安装应符合下列规定：\n1传感器端面与测速齿轮顶之间的安装间隙应符合产品技\n术文件要求。\n2传感器端面与被测轴之间的间隙，若轴标记为缺口时，应\n按轴的平滑面确定，若轴标记为凸台时，应按凸台面来确定。\n18\n015190.4-201"},{"s":0,"p":32,"t":"4 取源部件及敏感元件安装","x":"4.7.5 轴向位移和胀差测量用的电磁感应式和电涡流式传感器的安装，应按产品技术文件的要求，推动转子使其推力盘紧靠工作或非工作推力瓦面，然后进行间隙调整。传感器中心轴线与测量\n表面应垂直。\n\n4.7.6 主轴偏心测量用的电涡流式传感器安装位置，应符合产品\n技术文件的要求。\n\n4.7.7 轴振动测量用的电涡流式或电涡流磁阻组合式传感器安\n装，应符合产品技术文件的要求。\n\n4.7.8 安装在精加工轴承座平面上，测量轴承座绝对振动用的磁电式速度传感器和压电式速度传感器，应为刚性连接。当发电机、励磁机轴承座要求与地绝缘时，传感器外壳应对地浮空。\n4.7.9 热膨胀传感器应在汽轮机处于完全冷却状态下进行安装、调整零位，阀位行程传感器的安装位置，应使电气零位与机械零\n位一致。\n\n4.8 称  重\n\n4.8.1 电子皮带秤称量框架的安装，应符合下列规定：\n1应安装在倾斜度、张力变化小的室内皮带段上。2称量框架上的长辊及相邻托辊应处在同一平面上。3荷重传感器的安装应使其受力于中轴线上。4驱动速度传感器的摩擦滚轮的中心线，应与皮带传送方\n向垂直并可靠接触，不应有打滑现象。\n\n4.8.2 电子轨道衡秤台下面，各个荷重传感器的受力应均匀。\n\n4.9 其  他\n\n4.9.1 锅炉火焰检测装置的探头安装角度及使用温度应符合制造\n单位要求，并有防止污染的措施。\n\n4.9.2 工业电视摄像探头的安装角度及冷却方式，应符合制造单位技术文件的要求，摄像探头吹扫冷却用气，应是干燥仪用气。"},{"s":0,"p":33,"t":"4 取源部件及敏感元件安装","x":"4.9.3 固定在锅炉壁上的炉膛火焰摄像探头部件，应能随水冷壁自由膨胀，不得与锅炉钢架、平台等有刚性连接。\n4.9.4 锅炉管泄漏检测装置探测管的安装必须在锅炉水压试验前完成，在炉墙鳍片开孔时不得割伤水冷壁。喇叭口在炉墙孔处从里向外装出，其固定套管与炉墙应密封，探测管的另一侧与安\n装探头的管子也应密封。\n\n4.9.5 火灾探测器的安装位置应符合设计要求，探测器的确认灯应面向便于人员观察的主要入口方向。典型火灾探测器宜水平安\n装，当必须倾斜安装时，倾斜角不应大于45°。\n\n4.9.6 炉膛烟温红外线测量仪应水平安装，宜采用仪用压缩空气\n冷却。\n\n4.9.7 水冷发电机高阻检漏仪的两电极安装后，应检查极间绝缘，极间绝缘电阻值应符合制造单位产品技术文件要求。\n20\n493齿定在架炉学上的炉度火摄像操头件,能范水\n强自由影胀,不得写锅炉钢架、平合等有性连接\n494炉管泄满检测装置测管的安装必须在锅炉水压试\n前完成,在炉培籍片开孔时不得伤水登壁。以口在炉增孔处从里向外装出,其当定参管与炉增应密封,探测管的另一制与安"},{"s":0,"p":34,"t":"5 就地检测和控制仪表安装","x":"5就地检测和控制仪表的安装\n\n5.1 一般规定\n\n5.1.1 就地仪表安装环境应光线充足，满足操作维修和运行检查的要求，仪表安装高度、位置应便于运行和维护人员巡检。\n5.1.2 就地仪表安装环境应远离热源、振动源、干扰源及腐蚀性场所，环境温度、振动、干扰及腐蚀性应符合仪表使用要求。\n5.1.3 仪表接头的垫片材质应按本规范附录B的规定选用。仪表\n接头应视介质的压力选用接头连接方式和材质。\n\n5.1.4 仪表安装前应进行检查、检定。仪表应有标明测量对象、用途和编号的标识牌；就地仪表应在表壳右侧、盘上仪表应在表\n背面粘贴计量检定合格标签。\n\n5.1.5 就地仪表安装在露天场所应有防雨、防冻、防晒措施，在\n有粉尘的场所应有防尘密封措施。\n\n5.1.6 执行器电缆进线处应有可靠的密封措施，防止水沿进线口\n和电缆进入执行器接线端子处。\n\n5.1.7 油及燃气测量管路严禁装设排污阀，凝汽器真空和水位测量不得装设排污阀，发电机氢油差压不得装设平衡阀。烟风粉尘\n热工测量宜采用球形取样阀。\n\n5.2 指示仪表\n\n5.2.1 指示仪表宜直接安装在取样位置，不易观察时应引出，其\n刻盘中心距地面的高度宜为：\n1压力表1.5m。2差压计1.2m。\n21 21"},{"s":0,"p":35,"t":"5 就地检测和控制仪表安装","x":"5.2.2 测量蒸汽、水及油的就地压力表的安装应符合下列规定：\n1所测介质公称压力大于6.4MPa或管路长度大于3m时，\n除取源阀门外，应配置仪表阀门。\n2当被测介质温度高于60℃时，就地压力表的仪表阀门前\n应配置环形管或U形管；当只有取源阀门时，应在取源阀门前配\n置环形管或U形管。\n\n5.2.3 测量波动剧烈的压力，应在其取源阀门后加装缓冲装置。仪表应选用具有阻尼作用的压力表，如充油压力表和阻尼阀等。\n5.2.4 测量真空或微压的指示仪表应设置在高于取源部件的位置。\n\n5.3 变送器\n\n5.3.1 低量程变送器安装位置与测点的标高差应满足变送器零点\n迁移范围的规定。\n\n5.3.2 测量真空或微压的变送器应设置在高于取源部件的位置。\n5.3.3 测量蒸汽或液体流量时，差压变送器的设置应低于取源部件；测量气体压力或流量时，变送器的设置应高于取源部件，否\n则应采取放气或排水措施。\n\n5.3.4 差压仪表正、负压室与导管的连接应正确。蒸汽及水的差压测量管路，应装设排污阀和三通阀(或由平衡阀和正、负压阀门组成的三阀组),排污阀的选择应符合本规范第\n5.3.8 条的规定。\n仪表阀门安装前应对阀门工作状态进行检查。\n\n5.3.5 变送器宜布置在靠近取源部件和便于维修的位置，并适当\n集中。\n\n5.3.6 变送器安装在保温(护)箱内时，导管引入处应密封；应在箱外配置排污阀，排污阀宜集中布置；露天安装的仪表保温箱，\n箱内的加热设备工作应正常。\n\n5.3.7 仪表阀门、三阀组、排污阀的型号及规格应符合设计要求。排污阀公称通径宜选择10m,被测介质温度大于10℃时，应采\n用焊接方式。22\n015190,4-201"},{"s":0,"p":36,"t":"5 就地检测和控制仪表安装","x":"5.4 开关量仪表\n\n5.4.1 开关量仪表的敏感元件安装应符合本规范第4章的有关\n规定。\n\n5.4.2 开关量仪表安装前应进行外观检查，应安装在便于调整、维护、振动小和安全的位置。充压或毛细管类压力、温度开关测\n量管路应远离高温热源。\n\n5.4.3 开关量仪表应安装牢固，触点动作应灵活可靠。\n5.4.4 轴承润滑油压力开关应与轴承中心标高一致，否则整定时应考虑液柱高度的修正值。为便于调试应装设排油阀及调校用压\n力表，排油管道应引至主油箱或回油管上。\n\n5.4.5 安装浮球液位开关时，法兰孔的安装方位应保证浮球的升降在同一垂直面上；法兰与容器之间连接管的长度，应保证浮球能在全量程范围内自由活动。液位开关不应靠近热源以免引起开\n关、电缆损坏。\n\n5.5 分析仪表\n\n5.5.1 分析仪表的安装应符合产品技术文件的要求，并应满足下\n列规定：\n1应安装在便于维护、环境温度变化不大的位置，有恒温要\n求的装在恒温箱内。\n2安装位置应不受振动、灰尘、强烈辐射和电磁干扰的影响。\n\n5.5.2 进入分析仪表的介质参数应符合其要求，压力、温度较高时，应有减压和冷却装置，冷却水源应可靠，水质洁净。\n5.5.3 分析仪表的溢水管下应有排水槽和排水管，排水槽应设有\n观察孔，废液不得从排水槽溢出。\n\n5.5.4 电导式分析仪至转换器之间的距离及电极连接电缆的分布电容，应符合产品技术文件的要求，温度补偿器的连接导线直流\n电阻应小于2.5Ω。"},{"s":0,"p":37,"t":"5 就地检测和控制仪表安装","x":"5.5.5 水汽集中取样分析装置安装应符合《水汽集中取样分析装\n置验收导则》DL/T 65的规定。\n\n5.5.6 烟气连续监测(CEMS)仪表及设备安装应符合下列规定：\n1分析机柜应安装于专门的房间内，对粉尘、温度、湿度可\n控制，以保证分析仪的工作环境，并于房间装修全部完毕后进行。\n2烟气连续监测仪表采样点宜安装于烟气流场稳定、烟气\n混合均匀的断面。\n3系统采用加热法和稀释法采样时，采样管与分析仪的连接\n应符合产品技术文件的要求。\n\n5.5.7 烟气一氧化碳分析仪表安装应符合产品技术文件的要求，\n并满足下列规定：\n1采样点位置应满足气体流速稳定、样气具有代表性的要求。2为保证系统的反应速度，采样管线的长度不宜超过10m,\n不得多个仪表共用同一采样管线。\n3所有校正气储存在钢瓶内，校正气应有可追溯性文件。\n\n5.5.8 氢分析仪表安装应符合下列规定：\n1氢分析仪表及组件应检验合格。\n2氢纯度仪安装在制氢设备框架上或者墙壁上，物理位置在\n干燥设备后，汇流排附近。\n3汇流排装置安装水平允许偏差小于10m,垂直允许偏差\n小于1.5m。\n4氢系统的阀门宜采用气体球阀、截止阀。5严禁将氢气从压力设备及管道内急剧放出。\n\n5.6 执行器\n\n5.6.1 执行机构安装前应进行下列检查：\n1执行机构动作灵活，无松动、变形及卡涩等现象。2核对执行机构铭牌参数与设计要求一致。\n3电动执行机构绝缘电阻应合格，通电试转动作平稳，开度"},{"s":0,"p":38,"t":"5 就地检测和控制仪表安装","x":"指示无跳动。\n4气动执行机构通气试验，其严密性、全行程时间、自锁等\n符合产品技术文件的要求。\n\n5.6.2 调节机构的动作应平稳、灵活，无松动及卡涩现象，并能全关和全开。调节机构上应有明显的和正确的开、关标识，布置\n位置、角度和方向应满足执行机构的安装要求。\n\n5.6.3 执行机构应安装牢固，动作时无晃动，其安装位置应便于\n操作和检修，不妨碍通行，不受汽水浸蚀。\n\n5.6.4 当调节机构随主设备产生热态位移时，角行程执行机构的\n安装应保证和调节机构的相对位置不变。\n\n5.6.5 二次风门等靠近热源安装的执行机构，其所处环境温度应满足执行机构的温度条件，如不满足，应采取隔热措施。\n5.6.6 角行程执行机构从全关到全开的行程，应与调节机构的全行程相应。在50?度时，它们的转臂分别与连杆近似垂直。\n5.6.7 模拟量控制系统中的角行程执行机构转臂和调节机构转臂\n与连杆之间的连接，宜采用球形铰链。\n\n5.6.8 角行程执行机构和调节机构的转臂应在同一平面内动作，\n否则应加装中间装置或球形铰链。\n\n5.6.9 球形铰链应紧密安装在转臂的锥孔内，用锁紧螺母锁紧，\n并加装开口销，防止锁紧螺母脱落。\n\n5.6.10 连接执行机构与调节机构的连杆长度应短且可调，不宜大于5m且有足够的强度，其丝扣连接处应有锁紧螺母，传动作\n应灵活，不颤动，无空行程及卡涩现象。\n\n5.6.1 执行机构应有明显的开、关方向标识，顺时针为“关”、\n逆时针为“开”。\n\n5.6.12 电动执行机构的减速箱应按产品技术文件的要求加注润\n滑油，不得有渗漏油现象。\n\n5.6.13 气动执行机构气缸的连接管路应有足够的伸缩余地，且不\n得妨碍执行机构的动作。"},{"s":0,"p":39,"t":"5 就地检测和控制仪表安装","x":"5.6.14 带有阀门定位器的气动调节阀，定位器的气源压力应与调节阀的信号压力相匹配，信号管路连接应符合正作用或反作用\n的要求，反馈机构的安装应符合阀门行程的要求。\n5.6.15 阀门电动装置的检查应符合下列规定：\n1电气元件齐全、完好，内部接线正确。2行程开关、力矩开关及其传动机构动作灵活可靠。\n3绝缘电阻合格。\n4电动机外观检查有异常时，应解体检修。\n5电动机可靠接地。\n\n5.6.16 电磁阀的安装应符合下列规定：\n1安装前检查电磁阀的电压等级以及交、直流供电方式，铁\n芯应无卡涩现象。\n2安装时宜避开高温管道、设备。\n5.6.17 调节阀体上箭头的指向应与介质流动的方向一致；调节阀的阀位指示应清晰、准确，并应在调节阀调试中同步进行核对\n和标定。\n\n5.6.18 安装在振动环境的气动执行机构，气源管宜采用软管，气\n源接头宜采用螺纹连接。"},{"s":0,"p":40,"t":"6 控制盘箱柜安装","x":"6控制盘(台、箱、柜)的安装\n\n6.1 控制盘安装\n\n6.1.1 控制室和电子设备室的盘柜安装应在建筑装饰装修完成后进行。当设备或设计有特殊要求时，尚应满足其要求。\n6.1.2 搬运和安装控制盘时，不得损坏盘上的设备，并应采取防振、防潮、防止框架变形和漆面受损等措施。必要时可将装置性设备和易损元件拆下单独包装运输。当产品有特殊要求时，应符\n合产品技术文件的要求。\n\n6.1.3 控制盘的型钢底座应按图制作，型钢底座应进行防腐处理，其尺寸与控制盘相符，安装后的允许偏差应符合表\n6.1.3 的规定。\n表\n6.1.3 盘底座安装后的允许偏差\n项  目\n允许偏差\n每米(mm)\n全长(mm)\n不直度\n<1\n<5\n水平度\n<1\n<5\n位置偏差及不平行度\n<5\n\n6.1.4 盘柜底座应在地面二次抹面前安装，并应固定牢固、接地\n可靠，安装后宜高出最终地面10m～20m。\n6.1.5 控制盘安装前应做如下检查：\n1盘面平整，内、外表面漆层完好。\n2盘柜的外形尺寸、仪表安装孔尺寸、盘装仪表和电气设备\n的型号及规格等符合设计要求。"},{"s":0,"p":41,"t":"6 控制盘箱柜安装","x":"6.1.6 控制盘安装在振动较大的地方，应有减振措施。\n6.1.7 盘柜间应连接紧密、牢固，安装应使用防腐蚀的螺栓、螺\n母、垫圈等。\n\n6.1.8 控制盘单独或成列安装时，其垂直度、水平偏差及盘面偏\n差和盘间接缝的允许偏差应符合表\n6.1.8 的规定。\n表\n6.1.8 盘安装的允许偏差(m)\n项   目\n允许偏差\n垂直度(每米)\n<\n1.5 \n水平偏差\n相邻两盘顶部\n<2\n成列盘顶部\n<5\n盘面偏差\n相邻两盘边\n<1\n成列盘面\n<5\n盘间接缝\n<2\n\n6.1.9 仪表箱、保温箱和保护箱安装时应符合下列规定：1安装固定牢固。\n2垂直度的允许偏差小于3m,当箱的高度大于1.2m时，\n垂直度允许偏差小于4m。\n3水平度的允许偏差小于4m。4成排安装时整齐美观。\n6.1.10 盘内不得进行电焊和气焊作业，以免烧坏油漆及损伤导线\n绝缘，必要时应采取防护措施。\n\n6.1.1 控制盘柜应按本规范第\n9.2 节的有关规定进行接地。\n6.1.12 盘、柜内防火封堵应严密，所采用的防火封堵及阻燃材料\n应符合设计要求。\n\n6.1.13 盘、柜、箱、接线盒等安装，应符合下列规定：\n1周围温度不宜高于45℃,振动小，不受汽水浸蚀，光线\n充足，通风良好。"},{"s":0,"p":42,"t":"6 控制盘箱柜安装","x":"2不影响通行，便于操作维修。\n3箱体中心与操作地面的高度宜为1.2m～1.5m。4端子箱、接线盒密封，有命名标识，内附接线图。5热电偶的参比端与冷端温度补偿盒处于相同的环境温度。6不锈钢材质的接线箱固定时，不应与碳钢材料直接触。\n6.1.14 DCS/PLC盘柜应按照厂家规定进行安装，若盘柜与底座有绝缘要求，应保证盘柜与底座及其他系统盘柜间采用绝缘材料\n有效隔离。\n\n6.2 盘上仪表及设备安装\n\n6.2.1 控制室仪表及设备安装应符合下列规定：\n1显示器安装在室内建筑装饰工程结束后进行。2电子设备室内机柜上的模件安装在空调投入后进行，并采\n取防静电措施。\n3模件清理时用防静电吸尘器进行除尘。\n4模件的编址与对应接插件位置正确，插头接触良好。\n5基础底座安装完毕。\n6接地系统已施工完毕，接地电阻符合设计文件要求。\n\n6.2.2 仪表安装后，盘上不应进行会产生强烈振动的工作。\n6.2.3 仪表安装应牢固、平整。质量较大的仪表应安装托架，避\n免盘面变形。\n\n6.2.4 继电器、接触器、开关的触点应动作灵活，接触紧密可靠，\n无锈蚀或损坏。\n\n6.2.5 盘内电气设备应设置在便于操作、检查和维修的地方，强、\n弱电的端子应分开布置，并应排列整齐，固定牢固。\n6.2.6 盘内电缆、导线、仪表管应固定牢固，排列整齐、美观。\n6.2.7 盘内部连接导线，除了插件的连接采用单芯多股软线外，其他宜采用单芯单股绝缘线，盘内线路不得有中间接头，绝缘保\n护层不得有损伤。"},{"s":0,"p":43,"t":"6 控制盘箱柜安装","x":"6.2.8 导线、仪表管与仪表连接时，不得使仪表承受机械力，并\n应使仪表便于拆装。\n\n6.2.9 盘内仪表管不得妨碍仪表设备的拆装，并应单独排列，与\n导线保持适当距离，以免损伤导线。\n\n6.2.10 盘上仪表及设备的标牌、铭牌、端子，应完整、正确、清\n晰，并置于明显的位置。\n\n6.2.1 仪表及控制装置的接地应符合本规范第\n9.3 节的规定。\n6.2.12 在压力表盘内安装电气设备时，应有防水措施。\n6.2.13 抽屉式配电柜的抽屉应符合下列要求：\n1抽屉推拉灵活、轻便、无卡阻现象，同规格、型号的抽屉\n应能互换。\n2抽屉的机械闭锁或电气联锁装置动作正确、可靠，断路器\n分闸后辅助触头方能分开。\n3抽屉与柜体间的动力回路、二次回路连接插件接触良好。\n\n6.2.14 大屏幕显示器的安装应符合产品技术文件的要求，支架固\n定应牢靠。\n\n6.3 计算机及附属系统安装\n\n6.3.1 计算机及其设备在开箱和搬运过程中，不应有剧烈振动和\n灰尘、潮气进入设备。\n\n6.3.2 计算机及其设备应在控制室门窗、地面、墙壁、吊顶、照\n明、暖通系统等施工完毕后进行安装。\n\n6.3.3 计算机及其设备型号规格应符合设计，外观应完整，无损\n伤，附件应齐全、完好。\n\n6.3.4 计算机的预制电缆应敷设在带盖板的电缆槽盒中，金属电\n缆槽盒与盖板应接地良好。\n\n6.3.5 下列信号电缆不应通过计算机电缆槽盒内敷设：\n1电压不小于60V或电流大于0.2A的仪表信号电缆。2没有抗干扰措施的开关量输入、输出信号电缆。\n30\n01519.4-201"},{"s":0,"p":44,"t":"6 控制盘箱柜安装","x":"6.3.6 计算机预制电缆与其他电缆敷设在同一电缆通道时，计算机预制电缆槽盒宜布置在最下层；计算机预制电缆与一般控制电\n缆，允许在带有中间隔板的同一槽盒中敷设。\n\n6.3.7 计算机及其设备在插件检查、安装、试验过程中应有防静\n电措施。\n\n6.4 现场总线箱柜设备安装\n\n6.4.1 现场总线箱柜设备不得安装在高温、潮湿、多尘、有爆炸及火灾危险、有腐蚀作用、振动及可能干扰附近仪表通信等场所。当不可避免时，应按照设计文件及制造单位要求采取相应的防护\n措施。\n\n6.4.2 厂房内布置的现场通信箱应按照制造单位要求，安装在环境温度0℃～40℃、相对湿度10?95?结露的环境中。\n6.4.3 现场通信箱的安装位置应远离变频器、大功率电动机等大\n型电力设备、高电压强电流设备等干扰源。\n\n6.4.4 现场I/O站安装环境的温度、湿度、粉尘、振动、冲击等\n条件应满足设计或产品说明书的要求。\n\n6.4.5 现场总线网段终端电阻宜装设在系统机柜或现场总线就地接线箱内，不宜安装在就地的现场总线设备内。PROFIBUS DP\n总线应采用有源终端电阻。\n\n6.4.6 现场通信机箱应有明显的接地标识。\n31 01"},{"s":0,"p":45,"t":"7 电线和电缆的敷设及接线","x":"7电线和电缆的敷设及接线\n\n7.1 一般规定\n\n7.1.1 电缆桥架、电缆保护管的布置应考虑热力系统的膨胀。\n7.1.2 在不允许焊接的承压容器或管道上安装电缆保护管支架或电缆(桥架)支、吊架时，应采用U形螺栓、抱箍或卡子\n固定。\n\n7.1.3 在有爆炸和火灾危险的环境中敷设电线和电缆时，应符合《电气装置安装工程爆炸和火灾危险环境电气装置施工及验收\n规范》GB 50257和本规范第\n10.2 节的有关规定。\n\n7.1.4 引至设备的电缆保护管口位置，应便于与设备连接并不妨碍设备拆装和进出。并列敷设时，管口应排列整齐且间距应满\n足要求。\n\n7.1.5 整根电缆保护管应自成一体，中间不得中断。电缆保护管与设备之间的连接宜采用金属软管。其施工应符合《电气装置安装工程电缆线路施工及验收标准》GB 50168的有关规定，金属\n软管两端接口应使用专用接头附件连接。\n\n7.1.6 电缆保护管的制作应采用机械加工。电缆保护管配置前，应检查管内通畅无杂物；安装后，电线、电缆敷设前，管口应始\n终处于临时封闭状态。\n\n7.1.7 光缆的敷设环境温度应符合产品技术文件的要求。\n7.1.8 测量和控制回路接线后测试绝缘时，应采取防止弱电设备\n损坏的安全技术措施。\n\n7.1.9 用于保护、调节的重要测点信号电缆应独立敷设。"},{"s":0,"p":46,"t":"7 电线和电缆的敷设及接线","x":"7.2 电缆支吊架、电缆桥架安装\n\n7.2.1 电缆桥架结构类型、层间距离、支吊架跨距、防腐类型等应符合设计要求，铝合金桥架在钢制吊架上固定时，应有防电化\n腐蚀的措施。\n\n7.2.2 电缆桥架的连接、变径、转弯时，应使用配套的附件连接，螺栓应由内向外穿，螺母应位于桥架外侧。桥架加工配制应采用\n机械切割。\n\n7.2.3 电缆桥架的结构，应满足强度、刚度及稳定性要求；钢制托臂在允许承载下的偏斜与臂长比值，不宜大于1/10;桥架在允\n许均布承载作用下的相对挠度值，应符合下列规定：1钢制桥架不宜大于1/20。2铝合金制桥架不宜大于1/30。\n7.2.4 当直线段钢制电缆桥架超过30m、铝合金或玻璃钢电缆桥架超过15m及电缆桥架跨越建筑物伸缩缝时，其连接宜采用伸缩连接板，两端应采用截面积不小于4m2的多股软铜导线或铜编\n织网，端部压镀锡铜鼻子可靠跨接。\n\n7.2.5 电缆槽盒的加工应尺寸准确、平整、内部光洁，无毛刺；槽盒的安装应横平竖直、排列整齐，其上部与楼板之间应留有便\n于操作的空间。\n\n7.2.6 电缆桥架和槽盒的盖板应固定牢靠，便于拆卸。\n7.2.7 通道处的电缆桥架宜高出地面2.5m以上。电缆桥架顶部距楼板不宜小于30m;在过梁或其他障碍物处，不宜小于50m。\n7.2.8 金属桥架应有可靠的电气连接并接地可靠。使用玻璃钢桥\n架，应沿桥架全长另敷设专用接地线。\n\n7.2.9 直接支撑电缆用的普通型支架层间距离应相同，层间净距应大于250m,在同一直线段上的支架间距应均匀：在水平敷设时，支架间距宜为0.4m～0.8m;垂直敷设时，支架间距宜为0.8m～\n1.2m。"},{"s":0,"p":47,"t":"7 电线和电缆的敷设及接线","x":"7.2.10 电缆与测量管路成排作上下层敷设时，其间距不宜小于\n200mm。\n\n7.2.1 电缆支架应固定牢固、横平竖直、整齐美观，各支架的同层横档应在同一水平面上，允许偏差小于5m,电缆桥架支吊架\n沿桥架走向左右允许偏差小于10m。\n\n7.2.12 垂直敷设的电缆支架，自地面或楼板2m高的区域内应设置护栏或保护罩。电缆穿过平台时，应加保护管或保护框，其高度不宜低于1m。电缆在穿墙、埋于地下及容易受到外界碰伤时，\n也应加装保护管。\n\n7.2.13 电缆桥架及槽盒穿过建筑物时应有一定坡度。电缆槽盒露天布置或布置在湿度较大宜结露的区域，槽盒的底部应设置\n排水孔。\n\n7.2.14 振动场所的桥架，包括接地部位的螺栓连接处，应装置弹\n簧垫圈。\n\n7.2.15 钢制电缆竖井内应设置电缆支架。\n\n7.3 电缆保护管安装\n\n7.3.1 电缆保护管的内径宜为电缆或导线束外径的\n1.5 倍～2倍。\n7.3.2 电缆保护管的弯曲角度不得小于90°,其弯曲半径不应小于其外径的6倍，单根管子的弯头不应超过3个，直角弯不应超\n过2个。\n\n7.3.3 电缆保护管应用卡子固定牢固，不应采用焊接方式固定。\n\n7.3.4 电缆保护管的加工应符合下列要求：\n1管口光滑、无毛刺或尖锐的棱角。\n2在弯制后，不应有裂缝和显著的凹瘪现象，其弯扁程度不\n宜大于管子外径的10?\n3金属保护管应采用镀锌管，镀锌管镀锌层剥落处应涂以\n防腐漆。\n\n7.3.5 电缆保护管或保护框引入落地式盘柜时，露出地面高度宜"},{"s":0,"p":48,"t":"7 电线和电缆的敷设及接线","x":"为30m～50m;管口至悬挂式箱柜底面的距离宜为30m～40m,或通过连接附件直接与箱柜底部的电缆进线孔连接。\n\n7.3.6 电缆保护管的连接应符合下列要求：\n1金属管连接牢固，两管口不得错口，且不得直接对焊，采\n用套管套接后焊接或套螺纹接头连接，套管或带螺纹的管接头长度不应小于管外径的\n2.2 倍，明敷电缆保护管可采用专用电缆保\n护管连接接头对接。\n2两段金属管连接不宜用金属软管过渡。\n3硬质塑料管采用插接时，其插入深度宜为管子内径的\n1.1 \n倍～\n1.8 倍，在插接面上涂以胶合剂黏牢密封；采用套接时套管两\n端应封焊。\n4与电缆桥架、电线槽连接，宜从其侧面用机械加工方法开\n孔，并使用专用接头固定。\n5与设备连接宜采用金属软管两端套专用接头附件连接，金\n属软管的长度不宜大于1.2m。\n\n7.3.7 在室外和易进水的部位，电缆保护管口应低于设备进线\n孔，从设备下方引入，并封堵严密。\n\n7.3.8 电缆保护管的埋设深度应大于其1倍弯曲半径。\n7.3.9 并列管相互间宜留有不小于20m的间隙。\n\n7.4 线缆的敷设及固定\n\n7.4.1 电缆和补偿导线应敷设在金属电线管或线槽内，环境温度对电线的影响应满足正常使用时导体的温度，且不高于其规定的\n最高温度，否则应采取防护措施。\n\n7.4.2 补偿导线的型号应与热电偶的分度号及允差等级相符并应经校验合格，截面积应满足仪表或计算机温度模件的最大允许外部电阻要求，且不应小于1m2。两端接线时不得接错极性。\n7.4.3 轴承箱内的电线应采用耐油、耐高温绝缘软线。电线应固定牢固、拆装方便，其引出口应有密封连接器件等防止渗油的措施。"},{"s":0,"p":49,"t":"7 电线和电缆的敷设及接线","x":"7.4.4 电缆线芯的材质、型号、规格应符合设计要求。\n7.4.5 计算机信号电缆的选型应符合设计要求，设计未做规定时\n可按本规范附录D的规定选用。\n\n7.4.6 计算机信号电缆与强电控制电缆不得敷设在同一根保护\n管内。\n\n7.4.7 电缆敷设路径应符合设计要求并满足下列规定：\n1电缆避开人孔、设备起吊孔、窥视孔、防爆门及易受机械\n损伤的区域；敷设在热力设备和管路附近的电缆不应影响设备和\n管路的拆装。\n2明敷的电缆不宜平行敷设于热力管道上部，电缆与热力管\n道之间无隔板防护时，相互间距平行敷设时电缆与热力管道保温应大于50m,交叉敷设应大于250m,与其他管道平行敷设\n相互间距应大于10m。\n3电缆不应在油管路及腐蚀性介质管路的正下方平行敷设，\n且不应在油管路及腐蚀性介质管路的阀门或接口的下方通过。\n4电缆隧道、沟、竖井、夹层等封闭式电缆通道中，不得布\n置热力管道，严禁有可燃气体或可燃液体的管道穿越。\n5直埋敷设的电缆不得平行敷设于地下管道的正上方或正\n下方。\n\n7.4.8 电缆敷设在锅炉本体顶部、汽轮机本体四周、易积粉尘、易燃的位置及对有抗干扰要求的弱电信号电缆，应采用封闭的电\n缆托盘、槽盒或电缆保护管。\n\n7.4.9 搬运电缆时不应使电缆松散及损伤，电缆盘应按电缆盘上\n箭头所指方向滚动。\n\n7.4.10 电缆的敷设应在电缆支架和保护管安装结束后进行。\n7.4.1 敷设电缆时周围环境温度低于下列数值时应采取措施，否\n则不宜敷设：\n1耐寒护套控制电缆，-20℃。2橡皮绝缘聚氯乙烯护套控制电缆，-15℃。\n36\n081030"},{"s":0,"p":50,"t":"7 电线和电缆的敷设及接线","x":"3聚氯乙烯绝缘和护套控制电缆，0℃。\n7.4.12 电缆在桥架上的排列顺序应符合设计要求，信号电缆、控制电缆与动力电缆宜按自下而上的顺序排列。每层桥架上的电缆\n可紧靠或重叠敷设，但重叠不宜超过4层。\n\n7.4.13 信号电缆与动力电缆之间的距离应符合设计要求，设计未\n做规定时其最小距离应符合本规范附录E的规定。\n7.4.14 电缆、光缆的最小弯曲半径应符合下列规定：\n1无铠装层的电缆，不小于电缆外径的6倍。\n2有铠装或铜带屏蔽结构的电缆，不小于电缆外径的12倍。3有屏蔽层结构的软电缆，不小于电缆外径的6倍。4阻燃电缆，不应小于电缆外径的8倍。\n5氟塑料绝缘及护套电缆，不应小于电缆外径的10倍。6光缆，不应小于光缆外径的15倍(静态)和20倍(动态)。7现场总线通信电缆单个弯曲时应大于电缆外径的10倍，\n多个连续弯曲时应大于电缆外径的20倍。\n7.4.15 电缆跨越建筑物伸缩缝处，应留有补偿长度。\n7.4.16 电缆敷设时应防止由于电缆之间及电缆与其他硬质物体之间摩擦引起的机械损伤。电缆竖井出口处过渡部分的电缆桥架，\n应有防止因电缆受力引起电缆绝缘损伤的措施。\n\n7.4.17 电缆敷设应按顺序排列整齐，绑扎固定，不宜交叉，不得采用铁丝直接捆扎电缆，宜在以下部位设置绑扎点：1垂直敷设时，在每一支架上。\n2水平敷设时，在直线段的首末两端及每间隔5m～10m处。\n3电缆拐弯处。4穿越保护管的两端。\n5电缆引入表盘前30m～40m处。6引入接线盒及端子排前150m～30m处。\n\n7.4.18 电缆敷设后应及时挂装标识牌，并符合下列要求：1电缆终端头处挂装标识牌。"},{"s":0,"p":51,"t":"7 电线和电缆的敷设及接线","x":"2标识牌有编号、电缆型号、规格及起止地点，字迹清晰不\n易脱落。\n3标识牌规格宜统一，应能防腐，挂装牢固。\n\n7.4.19 电缆通过电缆沟、竖井、建筑物及进入盘柜时，出入口应\n按设计要求进行封堵。\n\n7.4.20 现场总线电缆与动力电缆必须分开排列。平行敷设时，其间距不宜小于20m。有雷击可能的不应小于50m。交叉敷\n设时，应直角交叉。\n\n7.4.21 现场总线电缆通过复杂电磁环境(如变频器等强干扰源) 或离开桥架后应用金属套管保护，必要时增加总线专用槽盒。\n7.4.2 现场总线电缆敷设余量不宜过长，不应形成环状。\n7.4.23 任意两个PROFIBUS DP从站间的DP电缆长度宜不小于\n1m。\n\n7.4.24 冗余的通信电缆宜在分开的电缆桥架上敷设。\n7.4.25 站与站之间通信电缆不应有中间接头。\n7.4.26 各现场总线网段长度应留有裕量。\n\n7.4.27 电缆沟道、电缆桥架和竖井等采取的防火封堵措施，应符\n合本规范第10.2.10～\n10.2.14 条的规定。\n\n7.4.28 电缆敷设前，应先进行桥架内部清理工作；电缆敷设完毕\n后，应及时清除杂物，盖好盖板。\n\n7.5 接  线\n\n7.5.1 电缆接线前应做电缆头，电缆头应排列整齐、固定牢固。\n铠装电缆作电缆头时，其钢带应用包箍扎紧。\n\n7.5.2 集中布置盘柜电缆头的高度宜保持一致，电缆头距离盘柜底部高度不宜小于20m,分层布置时电缆头距离盘柜底部高度\n不宜超过60m。\n\n7.5.3 盘、柜内的电缆芯线，应垂直或水平有规律地整齐排列，备用芯长度应至最远端子处，并应有标识，且芯线导体不得外露。\n38\n015190.4-201"},{"s":0,"p":52,"t":"7 电线和电缆的敷设及接线","x":"7.5.4 电缆芯线不应有伤痕，单股线芯弯圈接线时，其弯曲方向应与螺栓紧固方向一致。多股软线芯与端子连接时，线芯应压接与芯线规格相应的终端附件，并用规格相同的压接钳压接。线芯与端子接触应良好，螺栓压接牢固。每个接线端子为一根接线，\n不得超过两根。\n\n7.5.5 芯线在端子的连接处应留有适当的余量，芯线的端头应有明显的不易脱落、褪色的回路编号标识，标识长度及字母排列方\n向应一致。\n\n7.5.6 导线不应有中间接头。\n\n7.5.7 屏蔽电缆或屏蔽补偿导线应按本规范第\n9.3 节的规定进行\n接地。\n\n7.5.8 光缆芯线终端接线应符合下列规定：\n1采用光纤连接盒对光纤进行连接、保护，在连接盒中光纤\n的弯曲半径应符合安装工艺要求。\n2光纤熔接处应加以保护和固定，使用连接器以便于光纤的\n跳接。\n3光纤连接盒面板应有标识。4光纤连接损耗值应符合表\n7.5.8 的规定。\n表\n7.5.8 光纤连接损耗值(dB)\n连接类别\n多  模\n单   模\n平均值\n最大值\n平均值\n最大值\n熔接\n0.15\n0.3\n0.15\n0.3\n\n7.5.9 现场总线终端接线应符合下列规定：\n1现场总线应采用IP65防护等级接线箱。穿入接线箱的电\n缆宜使用防爆电缆密封接头。\n2 DP、PA总线电缆进入机柜时，将电缆保护层剥去适当长\n度露出屏蔽层，不得损伤屏蔽层，使用专用EMC电缆卡将其固"},{"s":0,"p":53,"t":"7 电线和电缆的敷设及接线","x":"定在机柜入口，确保其屏蔽层与入口接地铜排可靠连接。\n3机柜、接线盒内无屏蔽的通信线不应与电源线一起绑扎；\n没有屏蔽的露出线应控制在50m以内。\n4通信电缆在机柜内布线时，应避免与强电线缆在同一线槽\n内走线，不得在柜内形成环状。\n40"},{"s":0,"p":54,"t":"8 管路敷设","x":"8管路敷设\n\n8.1 一般规定\n\n8.1.1 仪表管的材质及规格应符合设计要求，设计未做规定时，\n可按本规范附录F选用。\n\n8.1.2 仪表管在安装前应进行检查，所用管材应无裂纹、锈蚀及\n其他机械损伤。\n\n8.1.3 仪表管在安装前应进行清理，达到清洁畅通。安装前，管\n口应临时封闭，避免脏物进入。\n\n8.1.4 管路应按现场具体情况合理敷设，不应敷设在有碍检修、\n易受机械损伤、腐蚀和有较大振动处。\n\n8.1.5 油管路离开热源表面保温层的距离不应小于150m,不宜\n平行布置在热源表面的上部。\n\n8.1.6 管路位于隔墙、平台内的管段不应有接口。\n\n8.1.7 管路敷设在地下及穿过平台或墙壁时应加保护管(罩),保护管(罩)的外露长度宜为10m～20m,管路接头不应在保护管(罩)内，保护管(罩)与建筑物之间应密封严密，同一地点\n高度应一致。\n\n8.1.8 管路沿水平敷设时应有一定的坡度，管路倾斜坡度及倾斜方向应能保证排除气体或凝结液，否则应在管路的最高或最低点\n装设排气或排水阀门。\n\n8.1.9 测量凝汽器真空的管路应向凝汽器方向倾斜，防止出现水\n塞现象。\n\n8.1.10 测量粉、煤、灰、气体介质的导管应从防堵装置处向上引出，高度不宜小于60m,其连接头的孔径不应小于导管内径。"},{"s":0,"p":55,"t":"8 管路敷设","x":"8.1.1 敷设管路时，应考虑主设备及管道的热膨胀，并应采取补\n偿措施，以保证管路不受损伤。\n\n8.1.12 差压测量的正、负压管路，其环境温度应相同，并与高温\n热表面隔开。\n\n8.1.13 管路敷设应整齐、规范，减少交叉和拐弯。\n8.1.14 仪表管接至仪表、设备时，不应承受机械应力。\n8.1.15 管路的排污阀门应装设在便于操作和检修的位置，其排污情况应能监视。排污阀门下应装有排水槽和排水管并引至地沟。\n排水槽底部应高出地坪。\n\n8.1.16 管路敷设完毕应进行检查，应无漏焊、堵塞和错接等现象。被测介质为液体或蒸汽的导管、阀门、附件可随同主设备一起或按本规范附录A的标准单独进行严密性试验。空气和风压管路敷设完毕，用压缩空气将管内吹扫干净后，按本规范附录A的规定\n进行严密性试验。\n\n8.1.17 测量管道的防冻措施应符合本规范第\n10.3 节的规定。\n\n8.1.18 管缆的敷设应符合下列规定：\n1敷设前应进行外观检查，不应有明显的损伤。2敷设路径的环境温度符合管缆的使用温度。3防止管缆受机械损伤和交叉摩擦。4敷设后的管缆长度留有适当的余量。\n5管缆的分支处设接管箱，接管箱的位置便于检修。\n\n8.1.19 无油压缩空气管路敷设应符合下列规定：\n1供气母管及控制用气支管采用不锈钢管，至仪表及控制\n设备的分支管采用不锈钢管或紫铜管。\n2供气母管的终端宜设置吹扫用法兰堵板，母管的最低处设\n排液装置。\n3支管应从母管上半部引出。\n8.1.20 被测介质黏度高或对仪表有腐蚀的压力、差压测量管路上"},{"s":0,"p":56,"t":"8 管路敷设","x":"8.1.21 隔离容器应垂直安装，成对隔离容器内的液体界面应处在\n同一水平面上。\n\n8.1.2 隔离液的物理化学性质见附录G,可按以下原则选用：1与被测介质不相互混合和溶解。\n2密度应不同于被测介质密度，且有良好的流动性。3与被测介质和仪表工作介质不发生物理(扩散)和化学作\n用，不腐蚀仪表的敏感元件。\n4被测介质处于正常工作条件时，隔离液不挥发、不蒸发。5当环境温度波动时，隔离液的密度和黏度不应发生显著\n变化。\n6隔离液不应混入被测介质管路。\n8.1.23 测量管路的长度应符合设计，未设计时管路最大允许长\n度不宜超过50m。\n\n8.1.24 对于冗余控制的压力仪表应有各自的测量管路、阀门及\n附件。\n\n8.1.25 当管路穿过不同等级的爆炸危险区域、火灾危险区域和有\n毒场所的分隔间壁时，保护管或保护罩应密封。\n\n8.1.26 测量和输送易燃、易爆、有毒、有害介质的仪表管路，应\n进行管路压力试验和泄漏性试验。\n8.1.27 真空系统应选用真空专用截止阀。\n\n8.2 管路弯制和连接\n\n8.2.1 金属管的弯制应采用冷弯。\n\n8.2.2 仪表管的弯曲半径，金属高压管路不应小于其外径的5倍，金属中低压管路不应小于其外径的\n3.5 倍，塑料管不应小于其外径的\n4.5 倍。管子弯曲后应无裂缝、凹坑，弯曲断面的椭圆度不\n大于10?径。\n\n8.2.3 管路上需要分支时，应采用与导管相同材质的三通，不得\n在管路上直接开孔焊接。"},{"s":0,"p":57,"t":"8 管路敷设","x":"8.2.4 导管连接方式应符合设计要求。若设计未规定，可根据导管和被测介质参数选用对口焊接、套管接件焊接、卡套式管接头连接、压垫式管接头连接、胀圈式管接头连接、扩口式管接头连\n接和法兰连接等方式。导管连接应符合下列规定：\n1导管焊接工作符合《火力发电厂焊接技术规程》DL/T 869\n的有关规定。\n2相同直径仪表管的对口焊接，不得有错口现象，不同直径\n仪表管的对口焊接，其内径差不宜超过2m,否则应采用变径管\n过渡。\n3套管接件焊接的套管接件内径与导管外径相符。4卡套式管接头连接，装配后卡套的刃口应全部咬进钢管\n表层，接管口处要打磨平整，表面不能有毛刺和凹凸面，接管与卡套接头嵌入部位不应有弯曲现象，其尾部沿径向收缩，应抱住\n被连接的管子，不得松脱或轴向移动。\n5压垫式管接头连接和法兰连接的垫片按本规范附录B选用。6胀圈式管接头连接，装配后胀圈应抱住被连接的管子，不\n得松脱或轴向移动。\n7扩口式管接头连接的接头及装配方法符合《扩口式管接\n头》GB/T 5625～GB/T 5653的有关规定。\n8镀锌钢管的连接，应采用镀锌的螺纹管件连接，不得采用\n焊接。\n9燃油、燃气等易燃、易爆介质管道和设备的仪表阀门及接\n头应采用焊接方式连接。\n\n8.3 导管固定\n\n8.3.1 导管应采用可拆卸的卡子固定在支架上，成排敷设的管路\n间距应均匀。\n\n8.3.2 不锈钢管路与碳钢支吊架和管卡之间应采取防渗碳隔离\n措施。44"},{"s":0,"p":58,"t":"8 管路敷设","x":"8.3.3 管路支架的安装应牢固、整齐、美观，并符合管路坡度的要求。在不允许焊接支架的承压容器、管道及需要拆卸的设备上\n安装支架时应采用U形螺栓或抱箍固定。\n\n8.3.4 管路支架的间距宜均匀，各种管子的支架距离为：\n1无缝钢管：水平敷设时，1m～1.5m;垂直敷设时，1.5m～\n2.0m。\n2铜管、塑料管：水平敷设时，0.5m～0.7m;垂直敷设时，\n0.7m～1.0m。"},{"s":0,"p":59,"t":"9 屏蔽与接地","x":"9屏蔽与接地\n\n9.1 一般规定\n\n9.1.1 有抗干扰要求的仪表和计算机线路，应采用相应类型的屏\n蔽电缆。\n\n9.1.2 电缆的屏蔽形式和材质选择应符合《火力发电厂热工自动化就地设备安装、管路及电缆设计技术规定》DL/T5182的相关规定。\n9.1.3 仪表和控制系统接地分为保护接地和工作接地。\n9.1.4 仪表和控制系统接地的保护接地和工作接地应共用接地\n装置。\n\n9.1.5 接地线的标识颜色应为黄绿相间。\n\n9.2 保护接地\n\n9.2.1 供电压高于36V的现场仪表的外壳，仪表盘、柜、箱、盒、电缆槽盒、保护管、支架、底座、铠装电缆的铠带两端等正\n常不带电的金属部分，必须做保护接地。\n\n9.2.2 供电压不高于36V的现场仪表开关，当设计文件无特殊\n要求时，可不做保护接地。\n\n9.2.3 在非爆炸危险区域的金属盘、板上安装的按钮、信号灯、继电器等小型低压电器的金属外壳，当与已接地的金属盘、板接\n触良好时，可不做保护接地。\n\n9.2.4 仪表保护接地系统应接到电气设备的保护接地网上，连接应牢固可靠，不应串联接地。保护接地的电阻值应符合设计文件\n的规定。"},{"s":0,"p":60,"t":"9 屏蔽与接地","x":"1电缆桥架的起始端和终点端应与接地网可靠连接。全长不\n大于30m时，不应少于2处与接地网连接。全长大于30m时，应每隔20m～30m增加与接地网的连接点。应保证电气连接的全程\n贯通。\n2当变径、转角、伸缩节和桥架连接时，宜采用截面积不小\n于4m2的铜绞线且两端压镀锡铜鼻子跨接。\n3镀锌电缆桥架连接板的两端不跨接地线时，连接板每端\n应有不少于2个有防松螺母或防松垫圈的螺栓固定。\n4在建筑物上安装的电缆桥架及电缆保护管，可重复接地。\n\n9.2.6 利用各种金属构件作为接地线时，应保证其全程为完好的电气通路；利用串联的金属构件作接地线时，应在其串接部位焊\n接金属跨接线。\n\n9.2.7 不应利用金属软管、管道保温层的金属外皮或金属网以及\n电缆金属护层作接地线。接地线不应作其他用途。\n\n9.2.8 接地线应防止发生机械损伤和化学腐蚀。在可能使接地线遭受损伤处，均应用保护管或角钢等加以保护。接地线在穿过墙壁、楼板和地坪处应加装钢管保护套，有化学腐蚀的部分应采取\n防腐措施。\n9.2.9 防静电接地\n1控制室、电子设备间及电子信息系统机房的防静电措施应\n符合《电子工程防静电设计规范》GB 5061及《数据中心设计规\n范》GB 50174的相关规定。\n2导静电地面、活动地板、工作台框架基础的防静电接地应\n与保护接地合并，可共用接地连接线。\n3已经做了保护接地和工作接地的仪表和设备，不必再另做\n防静电接地。\n\n9.3 信号回路及屏蔽接地\n\n9.3.1 仪表及控制系统的信号回路接地和屏蔽接地应共用接地系"},{"s":0,"p":61,"t":"9 屏蔽与接地","x":"统，在同一侧接地。\n\n9.3.2 信号回路的接地应符合下列规定：\n1信号回路只应有一个公共接地点。\n2信号回路接地点应设在显示仪表(或计算机控制系统)侧，\n当采用接壳型热电偶和检测部分已接地的仪表时，不应再在显示\n仪表(或计算机控制系统)侧接地。\n3如现场测量仪表和控制室的显示仪表(或计算机控制系\n统)两侧都有接地要求时，应采用信号隔离器将两个接地点之间\n的直流信号回路隔离开。\n4信号回路接地的位置应符合设计文件的规定。\n\n9.3.3 屏蔽电缆、屏蔽补偿导线的屏蔽层接地应符合下列规定：1总屏蔽层及对绞屏蔽层均必须接地。\n2全线路屏蔽层必须有可靠的电气连续性，当屏蔽电缆经接\n线盒或中间端子柜分开或合并时，必须在接线盒或中间端子柜内将其两端的屏蔽层通过端子连线，同一线路屏蔽层只允许有一个\n接地点，不得浮空或重复接地。\n3屏蔽层接地的位置应符合设计要求，当信号源浮空时，应\n在计算机侧；当信号源接地时，屏蔽层的接地点应靠近信号源的接地点；当放大器浮空时，屏蔽层的一端宜与屏蔽罩相连，另一端宜接共模地，其中，当信号源接地时接现场地，当信号源浮空\n时接信号地。\n4多根电缆屏蔽层的接地汇总到同一柜内接地母线排时，应\n用截面积不小于1m2黄绿相间接地软线压接，压接时接地软线应搪锡处理，屏蔽线宜在柜内接地母线排均匀布置，每个线鼻子\n内接地软线数量不得超过6根。\n\n9.3.4 采用ROFIBUS PA和F H1现场总线的通信电缆，屏蔽层的接地方式为机柜侧单点接地，具体应满足下列规定：\n1连接现场总线仪表的通信电缆，屏蔽层应浮空，不应与仪\n表地线或者机壳相连。48\n015190,4-201\n统,在同一侧接地。价buraE"},{"s":0,"p":62,"t":"9 屏蔽与接地","x":"2接至总线接线盒的通信电缆，屏蔽层应连接至接线盒的相\n应屏蔽端子，当多根通信电缆引入接线盒时，各电缆的屏蔽线不\n应相连。\n3接至总线机柜内的通信电缆，屏蔽层应在控制柜内与机柜\n地线可靠连接，实现单点接地。\n\n9.3.5 采用PROFIBUS DP现场总线的通信电缆，屏蔽层的接地\n方式采用等电位多点接地，具体应满足下列规定：\n1 PROFIBUS DP通信网络的等电位接地体可采用电气接\n地网。\n2系统内所有PROFIBUS DP设备的接地端以及PROFIBUS\nDP通信电缆的屏蔽层、金属线槽及支架都应在就地与等电位接地\n体可靠连接。\n3 PROFIBUS DP通信电缆进入机柜后，屏蔽层应在总线机\n柜内与机柜地线可靠连接，实现等电位连接。\n4当系统内没有可借助的等电位接地体时，系统各部件之间\n的等电位连接应使用铜质电缆或镀锌接地条。等电位连接的电缆或者接地条应与PROFIBUS电缆尽可能的接近，其材质与截面积要求如下：铜材质6m2;钢材质50m2。用于等电位连接的电缆或者接地条本身应采取防腐蚀措施，并与DP总线屏蔽层保证\n可靠连接。\n\n9.3.6 现场总线设备所有地线连接处均宜用垫圈压接，垫圈和面\n板连接处应无绝缘介质，表面涂漆应刮去。\n\n9.4 计算机监控系统接地\n\n9.4.1 若计算机监控系统产品技术文件要求控制装置及电子设备机柜外壳不与接地网连接时，其外壳应与机柜基础底座绝缘。\n9.4.2 计算机监控系统的接地方法应符合设计要求及产品技术文\n件的要求。\n\n9.4.3 计算机监控系统的接地系统应按设计直接在全厂电气接"},{"s":0,"p":63,"t":"9 屏蔽与接地","x":"地网上或接在独立接地网上，其连接方式及接地电阻均应符合设计要求。采用独立接地网时，接地电阻不应大于29,接地电阻应\n包括接地引线电阻。\n\n9.4.4 计算机监控系统的地线汇集板应满足设计要求或采用60m×20m×20m的铜板制作，该汇集板即为计算机系统参考零电位。该接地系统除接地点外，其余部分应与其他接地体隔离，保证计算机接地系统一点接地。地线汇集板应安装在封闭\n的接地端子箱内。\n\n9.4.5 地线汇集板和地网接地极之间连接的接地电缆截面积不应小于50m2,系统内机柜中心接地点至地线汇集板的接地电缆截面积不应小于25m2,接地电缆应采用低压铜芯电力电缆。机柜间链式接地线的截面积不应小于16m2,接地线应采用多芯软铜线。接地电缆线应采用压接线，线鼻子后与接地母线排可靠连接。\n9.4.6 不同的计算机监控系统(如DCS和DEH)的接地，当制造单位不允许共用地线汇集板时，其接地支线、地线汇集板以及地线汇集板和地网接地点之间连接的接地电缆线应分别独立设置。\n9.4.7 计算机监控系统在全厂电气接地网上的接地点应与大型电气设备的接地点之间保持足够的距离并符合制造单位要求。"},{"s":0,"p":64,"t":"10 控制装置及系统防护","x":"10控制装置及系统防护\n\n10.1 一般规定\n\n10.1.1 控制装置及仪表宜避免安装在易燃、易爆、易腐蚀等不利\n场合。\n\n10.1.2 安装在易爆、易燃区域的仪表和设备，其规格型号应符合设计文件规定，防爆设备应有铭牌和防爆标识，并有经国家授权\n的机构颁发的防爆合格证编号。\n\n10.1.3 所有控制装置的安装应采取防高温、防风、防尘、防冻、\n防潮、防雨措施。\n\n10.1.4 在爆炸性危险场所电气线路必须使用封闭式电气线路连\n接，电气线路应封堵严密。\n\n10.1.5 防爆区域的所有端子箱及带电设备必须可靠接地。\n10.1.6 在温度达到仪表管路内的介质冻结、凝固或产生结晶的场合，仪表管路应进行保温伴热，保温层的厚度应符合设计要求。\n10.1.7 电伴热电源控制箱安装前，应核实箱内各开关容量。\n10.1.8 盘柜及就地仪表支架在制作或安装过程中，局部油漆及镀锌层破坏后应重新涂刷防锈漆及面漆；所有金属构架应做防腐\n处理。\n\n10.2 防爆和防火\n\n10.2.1 爆炸和火灾危险环境电气装置施工应符合《电气装置安装工程爆炸和火灾危险环境电气装置施工及验收规范》GB 50257\n的有关规定。\n\n10.2.2 在有爆炸和火灾危险的场所内安装的仪表、电气设备和材"},{"s":0,"p":65,"t":"10 控制装置及系统防护","x":"料，应具有符合现行国家或行业防爆质量标准的技术鉴定文件和防爆产品出厂合格证书，防爆电气设备应有“Ex”标识，并在安\n装前检查其规格、型号及其外观，应无损伤和裂纹。\n\n10.2.3 爆炸危险区域的就地仪表安装后，所有的管路接口应严密。\n10.2.4 当防爆仪表和电气设备引入电缆时，应采用防爆密封圈密封或用密封填料进行封固，外壳上多余的孔应做防爆密封，弹性\n密封圈的一个孔应密封一根电缆。\n\n10.2.5 当电缆桥架或电缆沟道通过不同等级的爆炸和火灾危险\n场所时，在隔墙处应做充填密封。\n\n10.2.6 敷设在爆炸和火灾危险场所的电缆(导线)保护管，应符\n合下列规定：\n1保护管之间及保护管与接线盒之间，均应采用螺纹连接\n方式，螺纹有效啮合部分不应少于5扣，螺纹处应涂电力复合脂，并应用锁紧螺母锁紧，不得使用缠麻、绝缘胶带、涂料等，连接\n处应保证有良好的电气连续性。\n2保护管穿过不同等级爆炸和火灾危险场所的隔墙时，分界\n处应用防爆管件并充填密封。\n3保护管与就地仪表、敏感元件、电气设备、仪表箱及接线\n盒等连接时，应安装隔爆密封管件并做充填密封，密封管件充填距离不宜超过450m;根据其所在场所的危险级别分别采用隔爆型、安全防爆型或防尘型金属软管连接，金属软管的长度不宜超\n过450mm。\n4保护管应采用管卡固定牢固。\n10.2.7 线缆沿工艺管道敷设时，其位置应在爆炸和火灾危险性较小的一侧，当工艺管道内爆炸和火灾危险介质的密度大于空气密度时，线缆应在工艺管道的上方安装，反之应在其下方安装。\n10.2.8 现场的接线与分线，应按危险场所和区域类、级别的不同，分别采用防爆型或隔爆密闭型分线箱或接线盒，接线应牢固\n可靠、接触良好，并应加防松和防脱装置。"},{"s":0,"p":66,"t":"10 控制装置及系统防护","x":"10.2.9 本质安全型的仪表安装和线路敷设，应符合《自动化仪表\n工程施工及质量验收规范》GB 5093有关规定。\n\n10.2.10 集中布置的电缆应按设计要求施工，防火封堵严密、隔\n离措施有效。\n\n10.2.1 防火封堵材料应有产品合格证及同批次材料出厂质量检\n验报告，现场应进行复检。\n10.2.12 电缆防火阻燃应采取下列措施：\n1在电缆穿过竖井、墙壁、楼板或进入盘、箱、柜、台的孔\n洞处及电缆保护管的管口处，用防火堵料封堵严密。\n2在电缆沟和隧道中，按设计要求设置防火墙，防火隔离应\n严密。\n3在盘、柜、箱底部的电缆应各刷长度不小于150m的阻\n燃涂料，涂料厚度不少于1m。\n4在电缆或电缆桥架穿过墙壁、楼板、防火墙两侧的电缆应\n各刷长度不小于150m的阻燃涂料，涂料厚度不少于1m。\n10.2.13 防火封堵材料的使用应符合设计单位或制造单位的要求。防火堵料封堵应表面平整、牢固严实，无脱落或开裂。阻燃涂料的涂刷应厚薄均匀，不应漏刷和污染相邻物体。防火包不应\n板结，堆砌应密实牢固、外观整齐。\n\n10.2.14 电缆的防火封堵施工应按设计、工程实际选择防火封堵组件形式，并应按照《电力工程电缆防火封堵施工艺导则》DL/T\n5707和产品技术文件的规定进行施工。\n\n10.2.15 爆炸性气体环境敷设电缆，电缆线路中不应有接头。\n\n10.3 防  冻\n\n10.3.1 锅炉燃油系统仪表管路宜采用蒸汽伴热或热水伴热。\n\n10.3.2 管路伴热应符合下列规定：\n1管内介质保持的温度，在任何时候都不得使介质冻结或\n汽化。"},{"s":0,"p":67,"t":"10 控制装置及系统防护","x":"2差压导管的正、负压管受热应一致。\n3管路与伴热设施应一起保温，并要求保温良好和保护层\n完整。\n4 燃油及汽水管路：蒸汽伴热管路和测量管路宜保持\n20m～40m的间距，防止介质汽化。\n10.3.3 蒸汽伴热应符合下列规定：\n1伴热蒸汽压力宜为0.3MPa～1.0MPa。\n2蒸汽伴热管路应采用单回路供汽和回水，不应串联连接。\n3伴热管路的集液处应加排液装置。\n4伴热管路的连接宜焊接，固定时不应过紧，应能自由伸缩，\n接汽点应在蒸汽管的顶部。\n5伴热管路的进口应设截止阀，当采用有回水方式时，疏水\n器也应设截止阀。\n6单个管路的伴热在采用汽伴热时，使汽伴热管路沿测量管\n路径一同敷设固定。\n7多根或大型成排的管路可使汽伴热管路成S形敷设，伴热\n温度不能满足时，可上下或前后成S形叠加伴热。\n8伴热管路材质宜采用不锈钢管路均匀敷设在仪表管路下\n方或两侧，不锈钢管安装时不应与碳钢安装材料直接触，间距\n宜为20m～40m,并良好保温。\n10.3.4 热水伴热应符合下列规定：\n1热水伴热管道应单独供水，伴热系统间不应串联连接。\n2伴热管路的集汽处应加排汽装置。\n3伴热管路的连接宜焊接，固定时不应过紧，应能自由伸缩。4伴热管路宜采用不锈钢管路均匀敷设在仪表管路下方，不\n锈钢管安装时不应与碳钢安装材料直接触，间距宜不大于\n15m,并良好保温。\n10.3.5 电伴热应符合下列规定：\n1电热带的型号、规格应符合设计要求，电热带所耗功率的"},{"s":0,"p":68,"t":"10 控制装置及系统防护","x":"发热量，应能补偿热保温体系的全部热损失。\n2电热带的使用长度，应符合制造单位允许使用长度。3电热带在敷设前、后应进行外观和绝缘检查。4电热带最高耐热温度应大于冲管时导管表面温度，否则，\n电热带应与管路隔离，防止管路冲洗时烫伤电热带。\n5电热带的接入电压应与其工作电压相符，不得使用检修\n电源。\n6电热带应沿管路均匀敷设，固定牢固。\n7伴热温度传感器的安装位置应避免电伴热带直接加热，并\n调整到设定温度值。\n8伴热电缆敷设时，对于不能缠绕的伴热电缆应敷设在垂直\n管路的外侧、水平管路的下部，绑扎间隔不应大于30m,并应\n每隔2m留一定的膨胀余量。\n9易燃易爆场所内使用的伴热电缆，应配套专用的防爆接\n线盒。\n10伴热电缆敷设时不得重叠或交叉，防止其局部过热损坏。1仪表管路伴热电缆末端敷设至工艺管道的距离，根据工\n艺介质温度情况宜为10m～50m(或保证适当的距离),防\n止仪表管路局部上冻或伴热电缆末端烫坏。\n\n10.4 防  腐\n\n10.4.1 碳钢管路、各类支吊架、电缆桥架、保护管、固定卡、控制设备底座及需要防腐的金属结构，外露部分无防腐层时，均应\n涂防锈漆和面漆。\n10.4.2 涂漆应符合下列规定：\n1管路的面漆宜在严密性试验后涂刷。\n2涂漆前应清除表面的铁锈、焊渣、毛刺及油、水等污物。\n3涂漆宜在5℃～40℃环境温度下进行。\n4多层涂刷时，应在漆膜完全干燥后才能进行下道涂刷。"},{"s":0,"p":69,"t":"10 控制装置及系统防护","x":"5涂层应均匀、无漏涂，漆膜附着应牢固，无剥落、鼓泡、\n流痕等现象。\n6对油、氢、瓦斯等有危险性介质的管路应涂与主系统相同\n颜色的面漆。\n7测量管路冲管时导致高温的管路应涂刷耐高温漆。\n\n10.4.3 水处理车间的仪表管和电缆不应敷设在地沟内，以免腐蚀。\n10.4.4 对于地埋护套管及接地扁铁焊接部位应进行防腐油漆处理。\n10.4.5 含有酸、海水等腐蚀环境的管路应采用耐腐蚀的管路。\n10.4.6 仪表管道焊接部位的防腐应在管道系统压力试验完成后\n进行。"},{"s":0,"p":70,"t":"11 热工测量仪表和控制装置的调试","x":"1热工测量仪表和控制装置的调试\n\n1.1 一般规定\n\n1.1.1 现场仪表校验室的温度应保持在20℃±5℃,相对湿度不大于85?不应有振动和较强电磁场干扰，室内应有上、下水设施。\n1.1.2 热工测量仪表和控制装置在安装前应进行检查和校验。\n1.1.3 校验用的标准仪表和仪器应具备有效的检定合格证，封印应完整。其基本偏差的绝对值不应超过被校仪表基本偏差绝对值\n的1/3。\n\n1.1.4 对热工测量仪表和控制装置校验前的检查，应符合下列\n规定：\n1外观完整无损，附件齐全，表内零件无脱落和损坏，接线\n端子的标识清晰，铭牌清楚，封印完好，型号、规格和材质应符\n合设计要求。\n2校验用的连接电路、管路正确可靠。\n3电气绝缘符合国家标准、国家计量技术规程的规定或仪表\n安装使用说明书的要求。\n4电源电压稳定，20V交流电源和48V直流电源的电压波\n动范围不应超过±10?4V直流电源的电压波动不应超过±5?\n5气源应清洁、干燥，露点至少比最低环境温度低10℃,\n气源压力波动不超过额定值的±10?\n\n1.1.5 被校仪表和控制装置应待通电热稳定后，方可进行校验。\n1.1.6 仪表的校验点应在全量程范围内均匀选取在量程的整数点上进行，其点数除有特殊要求外，不应少于5点，且应包括上"},{"s":0,"p":71,"t":"11 热工测量仪表和控制装置的调试","x":"限、下限及常用点。\n\n1.1.7 热工测量仪表和控制装置的校验方法和质量要求应符合国家标准、国家计量技术规程的规定及制造单位仪表使用说明书\n的要求。\n\n1.1.8 热工测量仪表和控制装置校验后，应做校验记录，若对其内部电路、元器件、机构或刻度进行过修改，应在记录中说明。\n1.1.9 就地安装的仪表经校验合格后，应加盖封印，粘贴计量检定合格标签；有整定值的就地仪表，调校定值后，应将调定值机\n构漆封。\n\n1.1.10 执行机构应全行程内无阻碍且动作连续平稳、无卡涩，开、关方向标志明确，各处连接无松动或损伤，安装基础稳固。\n1.1.1 执行机构校验点应在全行程范围内均匀选取，其点数不\n应少于5点，且应包括机械零位和全开位。\n\n1.1.12 调节型执行机构的死区应符合设计要求，且不大于1? \n1.1.13 各种类型现场总线设备安装前应通过DCS系统厂家测\n试平台的通信测试，并出具通信测试合格报告。\n\n1.1.14 氧气表严禁沾染油脂。\n\n1.2 仪表调试\n\n1.2.1 指示仪表的校验应符合下列规定：\n1仪表面板清洁，刻度和字迹清楚。\n2指针在移动过程中应平稳，无卡涩、摇晃、迟滞等现象。3仪表应进行灵敏度、正行程、反行程偏差和回程差的校验。\n其正、反行程的基本偏差不应超过允许基本偏差。压力表在轻敲表壳后的指针位移，不应超过允许基本偏差绝对值的1/2。\n4电位器和调节螺丝等可调部件应留有余地。\n5仪表的阻尼时间应符合要求。\n6具有报警功能的指示仪表应检验报警值，输出接点应正确\n可靠。58\n015190.4-201\n限、下限及需用点。"},{"s":0,"p":72,"t":"11 热工测量仪表和控制装置的调试","x":"1.2.2 数字式显示仪表应进行示值校验，其示值基本偏差不应超过仪表允许的基本偏差，其他的性能指标和功能应进行检查，符合产品技术文件的要求。显示的符号和数字应清晰、正确，无跳\n变现象。\n\n1.2.3 记录仪表的校验应符合下列规定：\n1指示值的基本偏差不应超过仪表允许的基本偏差。\n0.5 级\n仪表记录值的基本偏差，不应超过±1.0?.0级仪表记录值的基本偏差不应超过土1.5?回程偏差应符合国家标准、国家计量\n技术规程的规定及仪表说明书的要求。\n2仪表指针的行程时间应符合国家标准或国家计量技术规\n程的规定。\n3环境温度为5℃～35℃、相对湿度不大于85?，仪表的\n测量电路与表壳，电力电路与表壳及测量电路与电路之间的绝缘电阻，用50V绝缘电阻表测量，不应小于20MQ2。\n4智能型记录仪表还应检查仪表的参数设定值，并对其他功\n能进行检查。\n\n1.2.4 变送器应进行下列检查和校验：\n1变送器的输入亳伏电势、电阻、压力、差压信号与输出信\n号的关系应与变送器铭牌上标识的一致，并与显示仪表配套。\n2压力、差压变送器应按产品技术文件要求的压力进行严密\n性试验，充压至量程压力保持5min,不应有泄漏。\n3调整变送器的零点、量程和阻尼时间，并根据运行的要求\n进行零点的正迁移或负迁移。\n4变送器的基本偏差或回程偏差，不应超过变送器的基本\n偏差。\n5智能型变送器应对参数组态进行检查或修改。\n\n1.2.5 报警、保护、联锁系统所使用的温度、压力、物位、流量等开关量仪表应进行检验；其动作值的整定应符合要求。\n\n1.2.6 压力仪表在校验时，应考虑实际使用中表管液柱高度的修"},{"s":0,"p":73,"t":"11 热工测量仪表和控制装置的调试","x":"正值。\n\n1.2.7 带有触点的仪表，应进行触点动作偏差调校。\n1.2.8 汽轮机转速、位移、振动、膨胀、偏心等监控仪表，应进行仪表值偏差、回程偏差的校验和传感器的检查，并应在专用校\n验台上进行传感器与显示仪表的联调。\n\n1.2.9 分析仪表的显示仪表应按本规范第1.2.1～\n1.2.3 条的要求进行校验，其传感器、转换器等装置应按产品技术文件的要求\n进行检查或校验。\n\n1.2.10 热电偶应进行相应的校验和检查：\n1测量主要参数的热电偶应进行校验，热电偶的允许偏差应\n符合要求。\n2热电偶的分度号应与配套仪表的分度号一致。3热电偶的检查：测量端应焊接牢固，表面光滑，无气孔；\n热电偶丝直径应均匀，无裂纹、无机械损伤、无腐蚀和脆化变质\n现象。\n4热电偶长度与设计相符。\n1.2.1 检查和测试热电偶冷端补偿盒、恒温箱和补偿导线，冷端温度补偿盒和补偿导线应与热电偶的分度号一致，允许偏差等\n级应相符。\n\n1.2.12 热电阻应进行下列校验和检查：\n1热电阻不应断路或短路，保护管应完好无损，无显露的锈\n蚀和划痕，热电阻的各部分装配应牢固可靠。\n2热电阻与保护管之间及双支热电阻之间的绝缘电阻，用\n10V绝缘电阻表测量，常温下，铂电阻的绝缘电阻应大于\n10MΩ,铜电阻的绝缘电阻应大于50MQ。\n3热电阻的分度号与其配套仪表应一致。\n4测量主要参数的热电阻安装前应进行检查，允许偏差应符\n合规定。\n\n1.2.13 用于热工自动化的电磁继电器或固态继电器应按主要性"},{"s":0,"p":74,"t":"11 热工测量仪表和控制装置的调试","x":"能和规范进行检查和校验，继电器应动作可靠，无抖动，触点接\n触电阻符合产品技术文件要求，功率符合设计要求。\n1.2.14 监视用工业电视系统应进行检查，系统切换，调整功能均能满足运行的要求。工业电视系统的自保护功能也应进行检查\n以保证系统的安全运行。\n\n1.2.15 超声波、射频导纳、导波雷达等物位测量仪表应根据产\n品技术文件进行通电功能检查。\n\n1.2.16 厂家配套外置磁感式液位开关应检查动态情况下常开常闭接点是否动作及动作值是否满足制造单位及设计要求，否则应\n做相应的高度调整。\n\n1.3 仪表管路及回路调试\n\n1.3.1 仪表管路应检查其连接正确，试压合格，符合附录A的\n要求。\n\n1.3.2 电气回路校对正确，端子接线牢固。\n\n1.3.3 交、直流电力回路送电前用50V绝缘电阻表检查绝缘电\n阻不应小于1MQ,潮湿地区不应小于0.5MQ。\n\n1.3.4 补偿导线的型号应与热电偶的分度号及允许偏差等级相\n符，并校验合格。\n\n1.3.5 现场总线电缆长度应满足网段传输速率的要求，应做到\n布线距离最短。\n\n1.4 执行机构调试\n\n1.4.1 电动执行机构\n1电源等级与设备铭牌上标识的一致，电源开关容量与设备\n铭牌上标识相匹配。\n2进行机械零位、全开位、阻尼时间、不灵敏区、力矩参数\n调校或设置。电动执行机构停在任一相应位置时晃动次数应小于3次，且全行程动作范围内无振荡现象出现。电动执行机构力矩"},{"s":0,"p":75,"t":"11 热工测量仪表和控制装置的调试","x":"设置宜为75?90且开力矩应大于关力矩。\n3进行全行程时间、不灵敏区、安全动作方向测试，全行程\n时间、不灵敏区和安全动作方向满足工艺系统要求。\n4基本误差不应大于基本误差限，回程误差不应大于基本\n误差的1/2。\n5进行功能检查。\n6涉及智能一体化电动执行机构，内容主要包括配合进行设\n备基本参数调试、空载、带负载调试和遥控操作。\n7电动执行机构应与控制系统进行联调：\n1)系统发出指令后，控制对象的动作方向及阀门(或\n挡板)的实际位置，应与显示画面显示一致，并符\n合实际工艺要求。2)核准控制逻辑中设定的开、关全行程时间的设定值，宜大于测试值5s~10s。\n\n1.4.2 气动执行机构\n1通气前应对气源管路进行吹扫。\n2气源管路应无泄漏，气源压力应调整在执行器、定位器设\n备铭牌标识范围内。\n3分别对电/气转换器、定位器、位置变送器进行零点、满\n度调校；定位器还需对不灵敏区进行调校，气动执行机构停在任一相应位置时晃动次数应小于3次，且全行程动作范围内无振荡\n现象出现。\n4对全开位、全关位限位开关动作以及全行程时间、安全动\n作方向和自锁性能进行调校、测试。\n5基本误差应不超过±1.5?定行程，其回程误差应不超\n过1.5?额定行程。\n6进行气源压力变化影响试验，气源压力变化额定工作压\n力的±10执行机构位置反馈的变化不超过额定位置反馈的"},{"s":0,"p":76,"t":"11 热工测量仪表和控制装置的调试","x":"7电磁阀应进行通电测试，动作应正确可靠、无卡涩，带电\n时无异声。\n8气动执行机构应与控制系统进行联调：\n1)系统发出指令后，控制对象的动作方向及阀门(或\n挡板)的实际位置。应与显示画面显示一致，并符\n合实际工艺要求。2)核准控制逻辑中设定的开、关全行程时间的设定值，\n宜大于测试值5s~10s。核准控制逻辑中设定与电磁\n阀铭牌标识的允许带电时间相匹配。\n\n1.4.3 液动执行机构\n1外观清洁无缺陷，设备配置与安装位置符合设计图纸要\n求，管路连接正确无误。\n2按照产品说明书查验动力源的工质品质，密封性应满足\n产品设计要求。工作环境应符合产品设计要求，工质工作压力应\n调整在设备铭牌标识范围内。\n3调试应在厂家配合下进行。分别进行开度及开度指示调\n整、动作方向调整、动作灵活性检查、零点及满度调校、过力矩\n开关调整、远方与就地切换等。\n4对全开位、全关位限位开关动作以及全行程时间、安全动\n作方向和自锁性能进行调校、测试。基本误差应符合其技术参数。\n5当失去动力源、失去控制信号包括控制系统模拟量输出卡\n件断电时，液动执行机构应能正确实现安全阀位动作，全开、全\n关或保持位置不动。\n6根据产品说明书和设计要求，进行相应个性化的功能测\n试，如快开、慢开、快速卸载等。液动执行机构存在快关、快开功能，需要使用录波仪检查开关时间，并满足要求。\n7液动执行机构应与控制系统进行联调：\n1)系统发出指令后，控制对象的动作方向及阀门(或\n挡板)的实际位置应与显示画面显示一致，并符合"},{"s":0,"p":77,"t":"11 热工测量仪表和控制装置的调试","x":"实际工艺要求。2)核准控制逻辑中设定的开、关全行程时间的设定值，宜大于测试值5s～10s。3)液动执行机构涉及就地泵组系统的工作，宜配合厂\n家进行现场调试，由厂家提交调试记录和报告。\n\n1.4.4 数据记录及现场恢复\n1记录调试参数，如位号、型号、规格、品牌、出厂编号、\n位置反馈和绝缘电阻等。\n2记录执行机构全开、全关动作时间；记录上、下行程0?\n25?50?75?10?反馈值及误差、死区、全关后首开指\n令值和全行程时间等。\n3调试完毕后应将执行机构恢复至调试前初始位置、恢复\n或做好维护保养措施，并切断执行机构的工作电源。\n\n1.5 现场总线调试\n\n1.5.1 准备工作\n1校对现场总线的设备清单、仪表清单、总线设备网段分配\n清册、总线仪表及设备布置等符合设计文件及相关技术规范。\n2对现场总线仪表和执行机构进行连接测试和物理层功能\n检查，现场总线电缆数据线或屏蔽线应无破裂，数据线及屏蔽线间应无短路，现场总线各网段终端电阻及电压满足要求。\n\n1.5.2 调试\n1对现场总线仪表和执行机构进行设备站号、通信速率、数\n据通信区域、数据量等参数设置。\n2同一现场总线网段上站地址不得重复。\n3做通信读取试验，确认现场总线仪表和执行机构的数据可\n以被组态软件正常读取。\n1.5.3 数据记录及现场恢复\n1调试结束后应记录现场总线仪表和执行机构的设备站号、"},{"s":0,"p":78,"t":"11 热工测量仪表和控制装置的调试","x":"通信速率、数据通信区域、数据量等。\n2使用专业工具对现场总线通信链路进行通信质量侦听，进\n行全网络状态分析和通信电缆及全网络健康诊断。在该网段设备全部处在通信状态下做两次侦听工作，一次在现场总线设备全部处于正常运行状态下，一次在系统工艺、电气设备全部处于正常\n运行状态下。\n\n1.5.4 如果设备暂时未安装，无法接线而需调试时，不应简单的扭接，应使用专用连接器临时接通或不截断通信电缆留有余地后\n直接连接下一设备。"},{"s":0,"p":79,"t":"12 启动前应具备的条件","x":"12启动前应具备的条件\n\n12.0.1 在安装及施工的检查和调校之后，应进行各项验收和资料\n交接，使其具备成套装置系统调试和试运的条件。\n\n12.0.2 取源部件、仪表管路、电气线路、供电和供气系统、热工自动化设备及其附件，均应按设计和本规范的规定安装完毕，且\n设备应完整、标识正确、清楚、齐全。\n\n12.0.3 电源的熔断器或开关的容量应符合使用设备的要求，并应\n有标识。备用电源应完好，具备投入条件。\n\n12.0.4 电气回路应接线正确、紧固，布线整齐、美观，端子固定\n牢固，性能良好，标识清楚。\n\n12.0.5 管路接头应紧固，垫圈合适，隔离容器应充满隔离液。\n12.0.6 气动管路吹扫完毕，气源干燥、洁净，压力符合设备使用\n要求，气源质量应符合下列规定：\n1露点：在线压力下的气源露点应比环境温度下限值至少低\n10℃。\n2含尘粒径：含尘粒径不应大于3μm。3含油量：油分含量不应大于10mg/m3。4污染物：无明显的有害气体或蒸汽。\n\n12.0.7 热工自动化单体设备校验，应检查完成并合格。\n12.0.8 控制室和电子设备室内环境应符合设计要求。\n12.0.9 热工设备部分防冻设施已投运并应符合使用要求。\n12.0.10 启动试运前应完成安装部分单位工程验收签证。\n66\n015190.4-2016"},{"s":0,"p":80,"t":"13 热控安装验收-提供文件清单","x":"13工程项目文件清单\n\n13.0.1 热控设备安装验收时应提供下列技术文件：\n1设计更改及材料代用通知单。2计量器具台账。\n3热工仪表及控制装置检定人员资格证书复印件。4设备缺陷通知单、设备缺陷处理报告单。5设备、材料出厂试验报告及质量证明材料清单。\n6防火封堵材料复检报告。7未完工程项目明细表。8提供下列隐蔽工程安装记录：\n1)汽轮机保护传感器安装记录及安装图。2)金属壁温安装记录及安装图。3)热机轴瓦及推力瓦测温元件安装记录。\n4)火焰检测探头安装记录。5)转机械量传感器安装记录。6) DCS接地安装记录及安装图。\n9提供下列施工技术记录：\n1)取源部件安装记录。\n2)温度、压力、流量、物位、分析、机械量、称重等就地仪表安装记录。\n3)控制盘、台安装记录。4)盘上仪表及设备安装记录。5)电缆桥架安装记录。6)电缆敷设记录。7)管路敷设记录。"},{"s":0,"p":81,"t":"13 热控安装验收-提供文件清单","x":"8)接地施工记录。9)防冻施 规定⋯⋯⋯⋯⋯⋯102 \n9.2 保护接地⋯⋯⋯⋯⋯⋯102 \n9.3 信号回路及屏蔽接地⋯⋯⋯⋯⋯102 \n9.4 计算机监控系统接地⋯⋯⋯⋯⋯103 10控制装置及系统防护⋯⋯⋯⋯⋯104\n\n10.1 一般规定⋯⋯⋯⋯⋯⋯104\n\n10.2 防爆和防火⋯⋯⋯⋯⋯⋯104 \n10.3 防冻⋯⋯⋯⋯⋯⋯⋯104\n1热工测量仪表和控制装置的调试⋯⋯⋯105\n\n1.1 一般规定⋯⋯⋯⋯⋯⋯105 \n1.2 仪表调试⋯⋯⋯⋯⋯⋯105 \n1.5 现场总线调试⋯⋯⋯⋯⋯⋯105\n12启动前应具备的条件⋯⋯⋯⋯⋯106 13工程项目文件清单⋯⋯⋯⋯⋯107 附录F仪表管材质及管径的选择⋯⋯⋯⋯108"},{"s":0,"p":101,"t":"引用标准名录","x":"3基本规定\n\n3.1 一般规定\n\n3.1.1 设计技术文件是施工的重要依据，如需更改应办理审批手续。按照《电力工程竣工图文件编制规定》DL/T 529的要求，设计单位受建设单位委托负责本单位设计范围内竣工图的编制，施工单位、调试单位应及时、准确地做好变更记录，提供完整的变更资料。合同具有法律约束力，因此施工中应按设备订货合同\n约定制造单位提供的技术文件执行。\n\n3.1.9 本条规定施工中应本着“四节一环保”,即节能、节地、节水、节材，环境保护的原则，进行绿色施工，是我国长期的政策\n导向，应认真贯彻。\n\n3.2 开箱检验与保管\n3.2.1-2依据设备类型，技术资料应包含安装使用说明书、\n合格证、检测实验报告、商检证明中的部分或全部资料。\n3.2.2 依据《电力基本建设火电设备维护保管规程》DL/T 85, 仓库类别为露天堆放场、棚库、封闭库、保温库、危险品库。对热控设备、材料按其特点及重要性，分别放在相应库房内保管，\n对于精密设备的保管环境要求，应存放在保温库内。\n3.2.4 有些设备(特别是进口精密设备)制造单位采用防腐包装，并为检验运输中是否发生异常情况，在包装箱内或外壁安装有湿度指示器、振动指示器或倾斜指示器等，应注意检查并\n做记录。\n88\n0L5190.4-201"},{"s":0,"p":102,"t":"引用标准名录","x":"3.3 施工准备\n\n3.3.3 本条规定中的对同一批次高温高压取源阀门的阀芯、阀座、阀杆的材质进行抽查检验，指同一厂家同一规格的取源阀门至少抽查一个，如果有问题，再扩大抽查比例。增加阀门抽取比例按\n照原抽检比例翻倍增加。\n89"},{"s":0,"p":103,"t":"4 取源部件及敏感元件安装 条文说明","x":"4取源部件及敏感元件的安装\n\n4.1 一般规定\n\n4.1.12 为确保安全，按不同的压力，取压装置应分别采用不同壁厚和形式的接管座直接施焊于热力设备或管道上，再焊接仪表管。根据现行业标准《电力建设施工技术规范第5部分：管道及系统》DL5190.5相应条款，管道分级按设计压力p为主要参数分级：p≤1.6MPa为低压管道；8MPa≥p>1.6MPa为中压管道；p >8MPa为高压管道(再热冷段和热段管道视为高压管道)。\n4.1.13 对用于汽轮机防进水保护的插入式管道上的测温元件，在管道直管段长度不满足该要求时，可于管道正上、下方开两个取\n样孔。\n\n4.1.19 本条为强制性条文。取样及测量管路独立，能保证保护、\n调节的信号更快速、准确响应系统波动。\n\n4.2 温  度\n\n4.2.3 为防止测温元件在运行中折断，除不安装在剧烈振动及共振影响的区域外，对低、中压大流速管道，如风机出口、循环水管道、厂用蒸汽管道等，由于介质流速大，易将测温元件冲断，应在安装温度元件插座时加装保护管或在其上游加装保护措施，\n避免温度元件直接受介质冲击。\n\n4.2.1 采用该安装方式需考虑套管尺寸与管道内径尺寸比例，不\n得影响系统通流量。\n\n4.2.15 为避免粉仓的测温元件被煤粉冲击而损坏，本条不推荐水\n平插入。90"},{"s":0,"p":104,"t":"4 取源部件及敏感元件安装 条文说明","x":"4.2.19 现场存在有些锅炉的过热器或再热器靠近顶棚管附近有护板的情况，无法满足离顶棚管10m以内的规定。\n4.2.21 蒸汽管道的上、下壁温测量元件，在抽汽管道逆止阀后，取样应在第一个水平管段的顶部和相应位置的底部；高压缸排汽口的冷段再热取样宜在垂直管与冷段再热管最低点。\n\n4.3 压  力\n4.3.1-8压力最低处取样点位置以制造单位资料为准。\n4.3.2 本条对于气体和液体介质的压力测点，规定了不同的安装方位，前者是使气体内的少量凝结液能顺利注回管道，而不致流入测量管路及仪表而造成测量偏差；后者是使液体内析出的少量气体能顺利流回管道，同时又能防止管道底部固体杂质进入测量管路。对于蒸汽介质的压力测点，规定了与气体和液体两者均可的安装方位，是考虑只要能保持测量管路内有稳定的冷凝液，同\n时又能防止管底部固体杂质进入测量管路即可。\n\n4.3.3 本条规定主要考虑防止粉尘进入取压装置和测量管路，简单防堵结构可采用扩大和加长的取压管，可拆卸的接头作吹扫用。防堵取压装置国内已有产品，引进工程多采用吹扫装置。\n\n4.4 流  量\n\n4.4.1 节流装置是使管道中流动的流体产生静压力差的一套装置，节流装置由节流件、取压装置组成，可通过测量差压来衡量流体流过节流装置时的流量大小。其技术要求及使用方法、安装和工作条件、检验规则和检验方法等在《用安装在圆形截面管道中的差压装置测量满管流体流量》GB/T2624中做了规定。\n4.4.2 节流件是节流装置中造成流体收缩且在其上、下游两侧产\n生差压的元件，包括孔板、喷嘴和文丘里管等。\n\n4.4.4 本条规定，邻近节流件(如有夹持环则邻近夹持环)的上游至少在2倍管道内径长度范围内，管道内径应是圆筒形的。当"},{"s":0,"p":105,"t":"4 取源部件及敏感元件安装 条文说明","x":"在任何断面上测量直径时，测量的直径平均值，取相互之间大致有相等角度的四个直径求其算术平均值之差不超过直径平均值的±0.3?其余所要求的最短管段长度范围内，只要目测检查表明\n是圆的，就可认为横截面是圆的。\n4.4.5～\n4.4.10 有关节流装置的安装要求依据《用安装在圆形截面管道中的差压装置测量满管流体流量》GB/T 2624修改。\n4.4.12 当流体为气体和液体时，取压口方位与压力测点方位相同。\n4.4.13 当水平或倾斜管道上安装节流装置时，为保证冷凝器内的液面高度稳定，多余的冷凝液应能流回管道，取压口安装在管道上半部是合理的。但是，由于冷凝液直接滴回管道时会引起测量不稳定，因此不应在管道的正上方取压。考虑到这一点，测量蒸汽流量时的取压口方位与测量蒸汽压力时的取压口方位做了不同\n的规定。\n\n4.4.14 测量蒸汽流量是否装设冷凝器，应符合设计要求。冷凝器的容积和水平方向横截面积的规定依据《差压计流量计检定规程》JG 640设计，以便忽略由于冷凝器中冷凝液面波动而产生的附加\n偏差。\n为使多余的冷凝液能顺利流回管道，规定了冷凝液面不低于\n取压口。当差压仪表高于节流装置时，冷凝器除了冷凝作用外，还兼有集气罐的作用，应装于最高点。为防止节流装置至冷凝器\n的管路因冷凝水堵塞，故应保温。\n4.4.18 管道的当量直径的计算式为\n2HL\nd=.\nH+L\n式中：H——管道高度；L ——管道宽度。\n\n4.4.20 在原规范基础上，依据《浮子流量计检定规程》JG 257\n编写。92\ns03201"},{"s":0,"p":106,"t":"4 取源部件及敏感元件安装 条文说明","x":"4.4.21 依据有关速度式流量计检定规程编写。速度式流量计是以直接测量封闭管道中满管流动速度为原理的流量计。\n4.4.2 质量流量计是通过测量差压、温度和密度，以计算质量流\n量的装置，其传感器直接固定在被测介质管道上。\n\n4.5 物  位\n\n4.5.4 平衡容器的疏水管应单独引至下降管，垂直距离为10m 左右，单独保温，在靠近下降管侧应装截止阀，保温是为了防冻。\n4.5.5 双室平衡容器除上部汽侧外均应保温，保温是为了防冻，\n减小测量偏差。\n\n4.5.6 高、低压加热器安装在室内，运行中不会冻结，故平衡容器及其管路不必保温，但停机后其内介质可能冻结时，应采取放\n水措施。\n\n4.5.12 双法兰变送器测量液位是将现场压力通过正、负压侧法兰上的阻隔膜片和毛细管内的充灌液传递到变送器上，而得到相应\n的测量信号的。因此对毛细管敷设做了规定。\n\n4.5.13 外浮筒液位计浮筒室壳体上的中线标识表示测量范围中\n点，供安装位置选择时参考。\n\n4.5.17 重锤式煤料物位传感器安装在煤仓顶部测量点的正下方，通过钢带吊有重锤上、下运动，不得使重锤处于加料口的正下方，否则重锤会被物料掩埋或缠住，传感器一定要垂直安装，以保证重锤返回时不碰到传感器的法兰孔口。射频导纳式煤料物位变送器安装在煤仓的顶部，通过屏蔽网电路将传感器垂直置于煤仓下\n部，为避免损坏传感器，应离开进、出料口。\n\n4.6 分  析\n\n4.6.1 分析仪表的取样部件安装，应按设计单位和制造单位产品技术文件的要求，装在取样品有代表性并能迅速反映介质真实\n情况的位置。"},{"s":0,"p":107,"t":"4 取源部件及敏感元件安装 条文说明","x":"4.7 机械量\n\n4.7.1 传感器和支架的固定要有防松动措施，以防运行中因振动\n造成松动而使测量失常酿成事故。\n4.7.41～2对转速测量，按《汽轮机安全监视装置技术条件》GB/T 139推荐的传感器类型，分别对其安装要求做规定。4.7.5～\n4.7.9 对轴向位移、胀差、主轴偏心、轴承座绝对振动、轴振动、热膨胀、阀位开度等测量，按《汽轮机安全监视装置技术条件》GB/T 139推荐的传感器类型，分别对其安装要求做规定。\n\n4.9 其  他\n\n4.9.4 锅炉管泄漏检测装置的探测器用于接收炉管少量泄漏时的音频信号，为防止外界声音传入，整个探测管要严格密封。\n4.9.5 依据《火灾自动报警系统施工及验收规范》GB 5016编写。\n94"},{"s":0,"p":108,"t":"5 就地检测和控制仪表安装 条文说明","x":"5就地检测和控制仪表的安装\n\n5.1 一般规定\n\n5.1.5 就地仪表安装在特定条件下应采取的措施。\n\n5.1.7 本条为强制性条文。本条主要为防止凝汽式汽轮机真空破\n坏和氢冷发电机组密封破坏导致事故的安全措施。\n\n5.2 指示仪表\n\n5.2.4 测量真空压力的仪表若低于测点，将会因凝结水无法排出\n而影响测量。\n\n5.3 变送器\n\n5.3.3 测量介质为蒸汽或液体时，仪表低于测点，测量系统内少量气体能顺利流回测点；测量介质为气体时，仪表高于测点，测\n量系统内少量凝结液能流回测点。\n\n5.3.8 依据《火力发电厂热工自动化就地设备安装、管路、电缆设计技术规定》DL/T5182对仪表阀门和排污阀等的选择做出规定。\n\n5.4 开关量仪表\n\n5.4.4 为便于调试应装设排油阀及调校用压力表，排油管道应引至主油箱或回油管上。为保证安全对调试所用的排油管道做出了\n明确要求。\n\n5.5 分析仪表\n\n5.5.5 水汽集中取样分析装置是用于蒸汽动力电站及供汽设备水"},{"s":0,"p":109,"t":"5 就地检测和控制仪表安装 条文说明","x":"汽的样品连续取样，并经预处理通过配套仪表进行自动分析和记录显示其品质的取样分析的装置，其安装要求应符合《水汽集中\n取样分析装置验收导则》DL/T 65的规定。\n\n5.5.6 烟气连续监测系统(continuous emision monitoring system, CEMS)用于监测烟气二氧化硫和氮氧化物的排放量，采用加热法和稀释法时，多点采样管路连接至合用的分析仪和数据采集装\n置应正确。\n\n5.6 执行器\n\n5.6.1 执行器是正向通路中直接改变操纵变量的仪表，它由执行机构和调节机构组成。将变化的信号变为相应运动的机构称为执行机构，由执行机构直接改变操纵变量的机构称为调节机构。"},{"s":0,"p":110,"t":"6 控制盘箱柜安装 条文说明","x":"6控制盘(台、箱、柜)的安装\n\n6.1 控制盘安装\n\n6.1.1 控制盘是用于安装监控过程所需要的仪表、设备及有关装置的刚性平板或结构，包括控制盘、控制台、模拟盘、电子装置机柜、端子柜(箱)、继电器柜、热力配电柜、保温箱、保护箱等，\n本规范统称为控制盘。\n\n6.1.3 依据《电气装置安装工程盘、柜及二次回路接线施工及验收规范》GB50171修订。其中盘底座水平度全长允许偏差对照《自动化仪表工程施工及验收规范》GB 5093和《电气装置安装工程盘、柜及二次回路接线施工及验收规范》GB 50171,为5m\n以内。\n6.1.14 DCS/PLC盘柜安装按照制造单位要求进行有效隔离，若DCS/PLC盘柜旁有其他机柜布置，则也应采取隔离措施。\n\n6.3 计算机及附属系统安装\n6.3.3～\n6.3.5 依据《火力发电厂分散控制系统技术条件》DL/T\n1083编写。\n\n6.4 现场总线箱柜设备安装\n6.4.1～\n6.4.5 依据《火力发电厂现场总线设备安装技术导则》\nDL/T 1212编写。"},{"s":0,"p":111,"t":"7 电线和电缆的敷设及接线 条文说明","x":"7电线和电缆的敷设及接线\n\n7.1 一般规定\n\n7.1.2 对电缆保护管安装做出具体要求，电线管安装可参照执行。\n\n7.1.4 满足检修维护空间。\n\n7.1.7 本条规定：光缆的敷设环境温度应符合产品技术文件的要求。光缆敷设的允许环境温度范围按其代号划分，即代号C1为-40℃～+60℃;C2为-30℃～+60℃;C3为-20℃~+60℃;\nC4为-5℃~+60℃。\n\n7.2  电缆支吊架、电缆桥架安装\n\n7.2.2 防止桥架防腐层破坏。变径指变宽、变高，变径板指变宽\n板、变高板。\n\n7.2.7 参照《综合布线系统工程验收规范》GB 50312编制。\n\n7.3 电缆保护管安装\n\n7.3.2 依据《电气装置安装工程电缆线路施工及验收规范》GB 50168编制，每根电缆管的弯头不应超过3个，直角弯不应超\n过2个。\n\n7.3.6 侧向开孔防止电缆保护管进水。\n\n7.4 电缆的敷设及固定\n\n7.4.1 参照《电力工程电缆设计标准》GB 50217编写。\n7.4.20 本条为强制性条文。确保现场总线不受干扰，保证总线设\n备投入准确。"},{"s":0,"p":112,"t":"7 电线和电缆的敷设及接线 条文说明","x":"7.5 接  线\n\n7.5.3 有标识便于备用芯的使用。\n99"},{"s":0,"p":113,"t":"8 管路敷设 条文说明","x":"8管路敷设\n\n8.1 一般规定\n\n8.1.6 参照《电力建设施工技术规范第5部分：管道及系统》DL5190.5编写。主要考虑如发生焊口泄漏，不易返修。\n8.1.9 管路朝凝汽器向下倾斜保证冷凝水回流至凝汽器。\n8.1.10 测量粉、煤、灰、气体介质的导管应从防堵装置处向上引出至少60m,保证气体中的灰尘和颗粒落回取压装置；接头孔\n径不小于导管内径防止导管堵塞。\n\n8.1.1 防止管路与主设备及管道膨胀不一致造成管路损坏。\n8.1.12 防止某一侧温度太高造成液体汽化或两侧液体密度不同\n造成测量值有误。\n\n8.1.14 接头对准可消除机械应力，防止损坏接头垫片，造成泄漏。\n8.1.15 在检查时便于观察排污阀门是否有内漏现象；如有，方便\n处理。对排污地点进行规定。\n\n8.1.16 管路在敷设完毕后进行检查，防止出现漏焊、堵塞和错接现象。对管路严密性试验的方法和要求进行了规定。\n8.1.18 管缆在现场施工易损坏，在敷设前进行外观检查，杜绝有质量问题的管缆应用到工程中。管缆的物理性能与环境温度有很大关系，应选择符合管缆使用温度的环境下进行管缆敷设，防止\n管缆损坏。\n\n8.1.20 加装隔离容器防止黏度高或腐蚀介质对压力测量仪表腐蚀。\n8.1.24 依据《火力发电厂热工自动化就地设备安装、管路及电缆设计技术规定》DL/T5182,冗余配置的变送器，是为了相互备用，\n也应保证各自独立的测量管路、阀门及附件。\n100\n04310-01"},{"s":0,"p":114,"t":"8 管路敷设 条文说明","x":"8.1.26 依据《自动化仪表工程施工及质量验收规范》GB 5093 第\n8.7.8 条款及《工业金属管道工程施工规范》GB 50235第\n8.6.6  条款的规定，测量和输送易燃易爆、有毒、有害介质的仪表管路，如因施工质量缺陷导致泄漏，可能会引起较严重的环境污染事件或人身伤害或中毒事件，故应进行管路压力试验和泄漏性试验。\n\n8.2 管路弯制和连接\n\n8.2.4 卡套式管接头连接头的选型及装配方法应符合《卡套\n式管接头》GB/T3758～GB/T3760的有关规定。\n\n8.3 导管固定\n\n8.3.1 保证管路便于拆卸检修。\n\n8.3.2 参照《电力建设施工技术规范第5部分：管道及系统》\nDL/T 5190编写。"},{"s":0,"p":115,"t":"9 屏蔽与接地 条文说明","x":"9屏蔽与接地\n\n9.1 一般规定\n\n9.1.2 本条是新增条款，对屏蔽电缆选型提出具体要求。\n9.1.3 本条是新增条款，对接地系统的种类和作用做出规定：\n1保护接地的作用是保护设备和人身安全。\n2工作接地又分为屏蔽接地和信号回路接地，其作用是抑制\n信号干扰，并为现场测量仪表和控制室的显示仪表(或计算机监\n控系统)两者提供一个公共的信号回路接地点。\n\n9.1.4 参考《自动化仪表工程施工及质量验收规范》GB 5093\n增加。\n\n9.1.5 本条是新增条款，提出对接地线标识颜色的要求。\n\n9.2 保护接地\n\n9.2.1 本条为强制性条文。内容参考国家标准，并将范围进行清晰准确界定。保护接地良好能有效杜绝人身触电伤亡事故发生。9.2.2～\n9.2.4 参考《自动化仪表工程施工及质量验收规范》GB\n5093增加。\n\n9.2.9 本条是新增条款，提出了防静电接地的区域和要求。\n\n9.3 信号回路及屏蔽接地\n\n9.3.1 本条是新增条款，根据抗干扰的原理，明确同一信号回路及屏蔽层只能有一个接地点。明确规定信号回路及屏蔽在同一侧\n接地。\n\n9.3.2 本条是新增条款，提出了对信号回路接地的具体要求。"},{"s":0,"p":116,"t":"9 屏蔽与接地 条文说明","x":"9.3.3 本款为强制性条文。屏蔽电缆、屏蔽补偿导线的屏蔽层接地涉及信号源的防干扰、正确性及计算机的运行可靠性。9.3.4～\n9.3.6 参考《火力发电厂现场总线设备安装技术导则》DL/T 1212,新增现场总线通信电缆接地要求条款。\n\n9.4 计算机监控系统接地\n\n9.4.3 计算机系统接地电阻的含义应包括：电气地网的电阻，从电气地网至DCS总接地板的连接电缆的电阻，总接地板至DCS 机柜不同性质接地的连接电缆的电阻，以及它们之间的接触电阻。\n9.4.6 本条是新增条款，不同的计算机控制系统虽然都是单点接入电气总接地网，但制造单位均有各自的接地要求，实际工程实\n施中都是分别设置独立的接地路径。\n\n9.4.7 本条是新增条款，主要是为了避免大型电气设备的干扰。本条目参考了一些DCS设备的接地要求，有的明确指出DCS系统的接地点(极)不允许与其他的电气设备共用，并应远离高电压、大电流电气设备的接地点；有的则对DCS接地点(极)与大型电气设备的接地点之间的距离给出了具体要求。具体建议以制\n造单位要求为准。"},{"s":0,"p":117,"t":"10 控制装置及系统防护 条文说明","x":"10控制装置及系统防护\n\n10.1 一般规定\n10.1.1～\n10.1.8 为新增条款，对控制装置及仪表安装需具备的基\n本防护要求做出规定。\n10.1.4～\n10.1.5 本条为强制性条文。防爆区域电气设备密封不良、\n接地不可靠易产生电火花，导致火灾、爆炸事故。\n\n10.2 防爆和防火\n10.2.1 《电气装置安装工程爆炸和火灾危险环境电气装置及验收规范》GB 50257适用于在生产、加工、处理、运转或储存过程中出现或可能出现气体、蒸汽、粉尘、纤维爆炸混合物和火灾危\n险物质环境的电气装置工程的施工及验收。\n10.2.3 爆炸危险区域的就地仪表管路接口应严密。\n10.2.4 防爆仪表及设备电缆进线口应封堵严密。\n\n10.2.9 本安型仪表即本质安全型仪表，又叫安全火花型仪表，是指仪表在正常状态下和故障状态下，电路、系统产生的火花和达\n到的温度都不会引燃爆炸性混合物。\n10.2.13 防火封堵材料的使用和施工艺要求。\n\n10.3 防  冻\n\n10.3.4 增加热水伴热基本要求。参考《自动化仪表工程施工及质量验收规范》GB 5093、《石油化工仪表及管道伴热和绝热设计\n规范》SH 3126编写。\n\n10.3.5 增加对电热带敷设之后的检查要求。\n104\n10控曾及系统防杆\n\n10.1  一 般 规 定"},{"s":0,"p":118,"t":"11 热工测量仪表和控制装置的调试 条文说明","x":"1热工测量仪表和控制装置的调试\n\n1.1 一般规定\n\n1.1.2 热工测量仪表和控制设备安装前进行检查和校验，以确保\n安装的是合格设备。\n\n1.1.5 被校验设备通电热稳定后进行校验才能保证校验结果稳定。\n1.1.6 明确校验点的选择。其数目除有特殊规定外，不少于5点，\n包括上限、下限及常用点。\n\n1.1.7 对于现场不具备校验条件的特殊仪表，应提供制造单位在厂试验的数据报告等，可不做精度校验，只对其鉴定合格证明的\n有效性进行验证。\n\n1.2 仪表调试\n\n1.2.15 增加超声波、射频导纳、导波雷达等新型物位测量仪表\n的要求。\n\n1.5 现场总线调试\n本节增加现场总线调试的内容和要求。"},{"s":0,"p":119,"t":"11 热工测量仪表和控制装置的调试 条文说明","x":"12启动前应具备的条件\n本部分系原规范内容独立成章，将启动前应具备的条件与热\n工测量仪表和控制装置的调试分开要求。\n106"},{"s":0,"p":120,"t":"11 热工测量仪表和控制装置的调试 条文说明","x":"13工程项目文件清单\n本部分系原规范内容独立成章，列出了施工完成后形成的签\n证、记录、试验及检测报告及需要提交的工程施工技术文件。\n107"},{"s":0,"p":121,"t":"11 热工测量仪表和控制装置的调试 条文说明","x":"附录F仪表管材质及管径的选择\n原附录F条款的修改，增加超临界机组仪表管路及材质选\n型，依据《火力发电厂热工自动化就地设备安装、管路及电缆设\n计技术规定》DL/T5182。\n108"},{"s":1,"p":1,"t":"封面 · 公告 · 前言 · 目次","x":"ICS 27.100\nF20\n备案号：J903-2018\nDL\n中华人民共和国电力行业标准\n代替 DL/T 5210.4 — 2009\n电力建设施工质量验收规程\n第 4 部分：热工仪表及控制装置\nCode for construction quality acceptance of electric power construct\nPart 4: Instrumentation and control equipment\n2018-04-03 发布\n2018-07-01 实施\n国家能源局\n发 布"},{"s":1,"p":2,"t":"封面 · 公告 · 前言 · 目次","x":"国家能源局\n公\n告\n2018 年 第 4 号\n依据《国家能源局关于印发〈能源领域行业标准化管理办法（试行）〉及实施细则的通知》（国能\n局科技〔2009） 52 号）有关规定，经审查，国家能源局批准《风力发电机组振动状态评价导则》等\n168 项行业标准，其中能源标准（NB）56 项、电力标准（DL）112 项，现予以发布。\n附件：行业标准目录\n国家能源局\n2018 年 4 月 3 日\n附件:\n行业标\n准目录\n序号\n标准编号\n标准名称\n代替标准\n采标号\n批准日期\n实施日期\n134\n电力建设施工质量验\n收规程 第 4 部分：\n热工仪表及控制装置\nDL/T\n5210.4 —\n2009\n2018-04-03\n2018-07-01\n・・・\nI\n国家能源后\n告\n公\n2018年 第4号\n在据《国家能源局￥下印岁《能酒每城行业标准化等理水法(过行)及算施细则的通知》(6\n品科技【209152号)有美规定,经由查,国家能源局批准《风力发中机组撒动然态评价导则》\n68项行业标准,其中能源标准(NB)56项、电力标准(DL)12项,现予以发布\n时件;行业标准目录\n回家能源后\n2018年4月3日"},{"s":1,"p":3,"t":"封面 · 公告 · 前言 · 目次","x":"U\n—1—\n刖\n舌\n本规程根据《国家能源局关于下达 2014 年第二批能源领域行业标准制（修）订计划的通知》（国能科\n技（2015） 12 号）的要求，在《电力建设施工质量验收及评价规程 第 4 部分：热工仪表及控制装置》\nDL/T 5210.4—2009 基础上修订。\n《电力建设施工质量验收规程》 DL/T 5210 共 6 个部分：\n—— DL/T 5210.1\n第 1 部分\n土建工程\n—— DL/T 5210.2\n第 2 部分\n锅炉机组\n—— DL/T 5210.3\n第 3 部分\n汽轮发电机组\n—— DL/T 5210.4\n第 4 部分\n热工仪表及控制装置\n—— DL/T 5210.5\n第 5 部分\n焊接\n—— DL/T 5210.6\n第 6 部分\n调整试验\n木规程是 DL/T 5210 的第 4 部分。\n本规程共 3 章和 10 个附录，主要内容包括：总则、术语、基本规定、施工质量验收范围划分及通\n用表格、取源部件及敏感元件安装、就地检测和控制仪表的安装、控制盘（台、箱、柜）的安装、电\n线和电缆的敷设及接线、管路的敷设和连接、屏蔽与接地、控制装置及系统的防护、热工测量仪表和\n控制装置的调试、附录、标准用词说明、引用标准名录、条文说明等。\n本规程主要对以下内容进行了修改：\n-—\n删除原规程中“单台机组质量评价”和“整体工程质量评价”，规程名称由《电力建设施工质量\n验收及评价规程 第 4 部分：热工仪表及控制装置》改为《电力建设施工质量验收规程 第 4 部分：热\n工仪表及控制装置》；\n-—\n删除原“\n4.3  通用标准”，将原“\n4.3  通用标准”中 \n4.3.1  和 \n4.3.2  的内容移到现 “\n3.10.2  通用\n标准 \"；\n——增加“燃气轮机发电机组热工仪表及控制装置安装”单位工程；\n一在现“辅助厂房水系统热工仪表及控制装置安装”单位丁.程中增加“中水处理热工仪表及控\n制装置安装”分部工程；\n——删除原单位工程“全厂门禁系统热控安装”；\n-一~ 删除原分部工程“解冻库热控安装”；\n一原“启动锅炉热控安装”“制氢、供氢站热控安装”''全厂监视系统热控安装” 单位工程并入\n现“共用热工仪表及控制装置安装”单位工程，作为其中的分部工程；\n——原“除氧给水热控安装”和汽轮机驱动的辅机设备单位工程融入到现“汽轮发电机组热工仪\n表及控制装置安装”单位工程；\n——原“脱硫、脱硝热控安装”单位工程改为 “烟气净化处理热工仪表及控制装置安装”单位工\n程，下设“脱硫”“脱硝”“脱碳”“除尘”四个分部工程；\n——原“\n4.9  防护与接地”拆分为现“\n3.8  廉蔽与接地”和“\n3.9  控制装置及系统的防护”；\n一原“\n4.10  热工测量仪表和控制装置的调试和验收”更名为 “\n3.10  热工测量仪表和控制装置的\n调试 \"；\n——增 n在被测对象上为安装连接检测元件所设置的专用管件、习出口和连接阀门等元件\n\n2.0.9 控制系统 controlsystem\n通过精密制导或操织若于变量以达到既定状态的系统\n注:仪表控出承统由仪表设务装置、仪表管线、仪表动力和辅助设施等理件,以及相关的款件构成\n\n2.0.10  回路 lop\n在控制系统中,一个成多个和关仪表与功能的组合\n\n2.0.1 焊炸危险区域 explosivedangerous zone\n爆炸性混合物出现的或预期可能出现的数量达到是以要求对电气设备的机构、安装和使用采取孩"},{"s":1,"p":9,"t":"封面 · 公告 · 前言 · 目次","x":"3 施工质量验收\n\n3.1  基 本规定\n\n3.1.1 \n火力发电工程热工仪表及控制装置安装工程的施工质量应按本规程的规定进行检查、验收，办\n理验收签证。\n\n3.1.2 \n工程施工质量的检查、验收应由施工单位根据所承担的工程范围，按本规程的规定编制施工质\n量验收范围划分表，监理单位进行审核，经建设单位确认后，由施工、监理及建设单位三方签字、盖\n章批准执行。采用总承包模式的工程项目，总承包单位应组织“施工质量验收范围划分表”的编制，\n按本规程“表 \n3.2.1 \n施工质量验收范围划分表”规定，参加工程施工质量的检查、验收。\n\n3.1.3 \n按本规程的规定对“施工质量验收范围划分表” 所列检验项目与工程实际检验项目不符合的部\n分可进行增加或删减。增加或删减的项目在质量验收范围划分表中的工程编号可续号、缺号，但不得\n变更原编号。\n\n3.1.4 \n工程施工质量应按木规程 “表 \n3.2.1 \n施工质量验收范围划分表” 规定的验收单位参加单位工\n程、分部工程、分项工程、检验批的验收。单位工程、性质为 “主控”的检验批应由建设单位组织验\n收，其他相关单位参加；分部工程、分项工程、检验批应由监理单位组织验收，其他相关单位参加；\n设计单位和设备制造单位应按 “表 \n3.2.1 \n施工质量验收范围划分表”的规定参加相关项目验收，需要\n设计单位和设备制造单位参加验收的其他项目应由建设单位根据实际情况进行确定。\n\n3.1.5 \n施工单位质量验收人员应持有与所验收专业一致的资格证书，且在有效期内，并报监理单位备\n案。涉及单位工程、分部工程、分项工程、检验批的质量验收人员的验收权限，应由建设单位组织相\n关单位确认。\n\n3.1.6 \n各级质检人员进行工程质量检查、验收除应严格执行本规程规定外，尚应按相关现行的国家和\n行业标准、合同约定、设计文件及制造技术文件执行，并对验收结果负责。\n\n3.1.7 \n施工项目必须施工完毕方可进行质量验收。对施工质量进行验收，施工单位应自检合格，且自\n检记录齐全后，方可报监理单位、建设单位进行质量验收。\n\n3.1.8  隐蔽工程应在隐蔽前山施工单位通知监理及有关单位进行见证验收，并应形成验收记录及签证。\n\n3.1.9  工程施工质量的检查、验收应按检验批、分项工程、分部工程和单位工程进行。\n\n3.1.10 \n工程施工质量验收顺序：检验批项目验收合格方可对分项工程进行验收；分项工程验收合格方\n可对分部工程进行验收；分部工程验收合格方可对单位工程进行验收。\n\n3.1.11  检验批、分项工程、分部工程、单位工程施工质量验收合格，应符合下列规定：\n1 按各检验批的规定，对其检验项目进行全部检查，检查结果符合质量标准，该检验批质量验收\n合格，检验批验收时应附记录表，记录表格式按照附录 B 至附录 K 填写。\n2 分项工程所含各检验批的验收全部合格、分项工程资料齐全，该分项工程质量验收合格。\n3 分部工程所含分项工程质量验收全部合格、分部工程资料齐全，该分部工程质量验收合格。\n4 单位工程所含分部工程质量验收全部合格、单位工程资料齐全并符合档案管理规定，该单位工\n程质量验收合格。\n\n3.1.12  当工程施工质量出现不符合时，应进行登记备案，并按下列规定处理：\n1 经返工重做或更换器具、设备的检验项目应重新进行验收。\n2 经返修处理后能满足安全使用功能的检验项目可按技术处理方案和协商文件进行验收。\n3 无法返工或返修的不合格检验项目应经鉴定机构或相关单位进行鉴定，对不影响内在质量、使\n3\n3施质量金收\n\n3.1 基 本规定\n\n31.1 火力发电工程热工仪表及控制夜置安表工程的能工质量应按本观程的观定进有检登、登收,为"},{"s":1,"p":10,"t":"3.2质量划分表","x":"用寿命、使用功能、安全运行的可做让步处理。经让步处理的项目不再进行二次验收，但应在 “验收\n结论”栏内注明，书 表是单位工程的施工管理情况的总体检查一览表，在单位工程资料组卷时应完整提供。\n\n3.2.3 \n按本表的规定应对本单位工程资料进行核查，核查结果应资料齐全、数据准确、签字齐全，核\n查内容作为单位工程验收合格的支持文件。\n\n3.2.4 \n本表提供了需统计的设计变更、材料代用的一览表格式，按单位工程进行统计。\n\n3.2.5 \n木表提供了需统计的设备材料出厂试验报告合格证明文件的一览表格式，按单位工程进行\n统计。\n\n3.2.6  本表提供了设备缺陷通知单的格式，相关方应签字确认。\n\n3.2.7 \n本表提供了设备缺陷处理报告单的格式，相关方应签字确认。\n\n3.2.8 \n本表提供了需统计的计量器具的一览表格式，按单位工程进行统计。\n\n3.2.9 \n检验批是按同一生产条件或按规定的方式汇总起来供检验用的，由一定数量样本组成的检验\n体，将检验结果填入本表内，表格上方的 “表号”填写对应的质量验收表编号，表格下方签字栏的签\n字范围与验收划分表对应。以下的分项工程、分部工程、单位工程签字原则相同。\n\n3.2.10 \n分项工程可由一个或若干检验批组成，将检验结果填入本表内。\n\n3.2.11 \n分部工程可由一个或若干分项工程组成，将检验结果填入本表内。\n\n3.2.12 \n单位工程可由一个或若干分部工程组成，将检验结果填入木表内。\n171\n3施工质量验收\n\n3.1 基本规定\n\n31.1 登收是指1程在施工单位对障工质量自打检春的基上,参与建设活动的有关单位其同对检9\n批、分项工程、分部工程、甲位工程的质量通行油样复登,表据相关称准以书面形式对工程质量达\n价马出\n313施工甲位可般据工程实际对谈表中的验收项目退行期加或制碳,比如司分甲位工程中,同编\n电得桥、电线音、电统保护、执打务的经收员。行编加或为藏方,为了全行业统,\n才核登,本条战定坩加或的或的项目,在重工质量验收范内分表中的程编号,同续号、读号,\n不得变更原谢号。\n319 施工质量的检查、验收,应按“施工质量验收蓿图划分表”中规定的各验收单位的验收范图\n发检验批、分项工程、分工程和甲位程进行:个单位工程由多个施工单位分别随时,可设\n单位工程。子单位工程编号应在原单位工程编号后加英文了母区分,如“1(a)”“1(b)”等\n.1.12工:对不合格的工程司仪来K的重新作、重新随工等指施\n这修:对1秸不付合称准规定的部位采取摇修等语届\n正步:对使用或放行不符合现定要求过程绍果的许司。\n\n3.2 施工质量验政范出划分及通用表格\n\n2.1 本规程质量验收范的划分为单位工程、分工程、分项工程和检验批。质量验收范的刻分\n中,仅对检验批的性质进行划分,分为“主控”和一般”,“性质”栏中空白则表示“一段”\n主控项目:对工程质量、功能、性搅、同靠性、安全、卫生、环境保护和公众利益起决定性作片"},{"s":1,"p":178,"t":"施工质量验收 条文说明","x":"3.3 \n取源部件及敏感元件安装\n3.3.2\n2\n测量金属壁温铠装热电偶安装检查验收表适用于各类测量金属壁温热电偶安装检查验收。\n3.3.4\n1 喷嘴及标准孔板安装检查验收表适用于各类喷嘴及孔板安装检查验收。\n2\n流量测量装置安装检查验收表适用于各类流量计安装检查验收。\n3.3.5\n3\n物（液）位计安装检查验收表适用于除液位测量取源装置及电接点液位计以外的各类物（液）\n位计安装检查验收。\n\n3.4 \n就地检测和控制仪表的安装\n3.4.2\n1 压力表安装检查验收表适用于各类压力表安装检查验收。\n3.4.6\n1 电动截止阀安装检查验收表适用于电动截止阀、电动拉杆、蒸汽吹灰器安装检查验收。\n\n3.9 \n控制装置及系统的防护\n3.9.1\n2 氢气、氨气、燃气、燃油等易燃、易爆区域安装的仪表设备和使用的材料，应符合 GB 50257\n的有关规定，还应符合国家和行业现行防爆质量标准。\n\n3.10 \n热工测量仪表和控制装置的调试\n3.10.3\n2 表 3.10.3-6 压力和差压变送器调校适用于各类压力和差压变送器调校。\n6 表 3.10.3-32 电感、电涡流式测量仪表调校适用于各类电感、电涡流式测量元件调校。\n3.10.4\n6\n表 3.10.4-29 电感、电涡流式测量仪表和保护装置回路调试适用于各类电感、电涡流式测量仪\n表和保护装置回路调试。\n172\n01715710.4-2018\n\n3.3  取源3件及敏感元件安"},{"s":1,"p":179,"t":"施工质量验收 条文说明","x":"600Z\n—\n寸.\nOx\nsu\nqc\nl>\n定\n8\n戛\n— const stds = DATA.stds, pages = DATA.pages;
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const imgPath = pg => '../' + stds[pg.s].folder + '/原图/p' + String(pg.p).padStart(3,'0') + '.jpg';

function init(){
  const sel = $('#std');
  stds.forEach((s,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=s.code; sel.appendChild(o); });
  const chars = pages.reduce((a,p)=>a+p.x.length,0);
  $('#scope').textContent = '（'+stds.length+' 份标准 / '+pages.length+' 页 / 约 '+(chars/10000).toFixed(1)+' 万字）';
  buildToc();
}
function buildToc(){
  const box = $('#toc'), map = new Map();
  let html = '';
  pages.forEach(p=>{ const k=p.s+'|'+p.t;
    if(!map.has(k)) map.set(k,{s:p.s,t:p.t,a:p.p,b:p.p}); else map.get(k).b=p.p; });
  let cur = null;
  map.forEach(v=>{
    if(v.s!==cur){ cur=v.s; html += '<div class="st">'+esc(stds[v.s].code+' '+stds[v.s].title)+'</div>'; }
    html += '<a href="#" data-s="'+v.s+'" data-p="'+v.a+'">'+esc(v.t)+
            ' <span style="color:#6b7480">（PDF 第 '+v.a+(v.b>v.a?'–'+v.b:'')+' 页）</span></a>';
  });
  box.innerHTML = html;
  box.querySelectorAll('a').forEach(a=>a.onclick=e=>{
    e.preventDefault(); show(pages.find(p=>p.s==a.dataset.s && p.p==a.dataset.p)); });
}
function snippet(text,q){
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i<0) return esc(text.slice(0,160));
  const a=Math.max(0,i-60), b=Math.min(text.length,i+q.length+120);
  return (a>0?'…':'')+esc(text.slice(a,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+
         esc(text.slice(i+q.length,b))+(b<text.length?'…':'');
}
function search(){
  const q=$('#q').value.trim(), s=parseInt($('#std').value,10), box=$('#list');
  if(!q){ box.innerHTML='<div class="empty">请输入关键词。</div>'; return; }
  const ql=q.toLowerCase(), hits=[];
  for(const p of pages){
    if(s>=0 && p.s!==s) continue;
    const xl=p.x.toLowerCase();
    let idx=xl.indexOf(ql), cnt=0;
    while(idx>=0 && cnt<50){ cnt++; idx=xl.indexOf(ql, idx+ql.length); }
    if(cnt) hits.push({p,cnt});
  }
  if(!hits.length){ box.innerHTML='<div class="empty">没有匹配结果，可尝试更短的关键词。</div>'; $('#stat').textContent=''; return; }
  $('#stat').textContent='命中 '+hits.length+' 页 / 共 '+hits.reduce((a,h)=>a+h.cnt,0)+' 处（点击查看该页全文与原图）';
  box.innerHTML = hits.map((h,i)=>
    '<div class="hit" data-i="'+i+'"><div class="t">'+esc(stds[h.p.s].code)+'</div>'+
    '<div class="p">PDF 第 '+h.p.p+' 页 ｜ '+esc(h.p.t)+' ｜ '+h.cnt+' 处</div>'+
    '<div class="s">'+snippet(h.p.x,q)+'</div></div>').join('');
  box.querySelectorAll('.hit').forEach(el=>el.onclick=()=>{
    box.querySelectorAll('.hit').forEach(x=>x.classList.remove('on'));
    el.classList.add('on'); show(hits[+el.dataset.i].p, q);
    if(window.innerWidth<=900) $('#detail').scrollIntoView({behavior:'smooth',block:'start'}); });
}
function show(p,q){
  q = q || $('#q').value.trim();
  let body;
  if(q){
    const parts = p.x.split(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'));
    body = parts.map((s,i)=> i%2 ? '<mark>'+esc(s)+'</mark>' : esc(s)).join('');
  } else body = esc(p.x);
  $('#detail').innerHTML = '<style>.back{display:none;margin:0 0 10px}@media(max-width:900px){.back{display:block}}</style>'+
    '<div class="back"><a href="#" id="backBtn">← 返回检索结果</a></div>'+
    '<h2>'+esc(p.t)+'</h2>'+
    '<div class="sub">'+esc(stds[p.s].code+' '+stds[p.s].title)+' ｜ PDF 第 '+p.p+
    ' 页 ｜ <a href="'+imgPath(p)+'" target="_blank">单独打开原图</a></div>'+
    '<pre>'+body+'</pre><img loading="lazy" src="'+imgPath(p)+'" alt="第'+p.p+'页原图">';
  const bb = document.getElementById('backBtn');
  if(bb) bb.onclick = e => { e.preventDefault();
    $('#list').scrollIntoView({behavior:'smooth',block:'start'}); };
  $('#detail').scrollTop = 0;
}
$('#go').onclick = search;
$('#q').addEventListener('keydown', e=>{ if(e.key==='Enter') search(); });
$('#q').addEventListener('input', ()=>{ if($('#q').value.trim().length>=2) search(); });
$('#std').onchange = ()=>{ if($('#q').value.trim()) search(); };
$('#clr').onclick = ()=>{ $('#q').value='';
  $('#list').innerHTML='<div class="empty">在上方输入关键词开始检索。</div>'; $('#stat').textContent=''; };
$('#tabSearch').onclick = ()=>{ $('#tabSearch').classList.add('on'); $('#tabToc').classList.remove('on');
  $('#list').style.display=''; $('#toc').style.display='none'; };
$('#tabToc').onclick = ()=>{ $('#tabToc').classList.add('on'); $('#tabSearch').classList.remove('on');
  $('#list').style.display='none'; $('#toc').style.display='block'; };
init();
</script>
</body>
</html>
